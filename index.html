mp-list a[hidden]{display:none!important}.selection-list{max-height:38vh;overflow:auto;margin:0 0 12px;padding-left:22px}.selection-list li{margin:5px 0;padding-left:2px}.selection-empty{color:var(--muted);font-size:14px;margin:6px 0 14px}.panel-actions{display:flex;gap:8px;flex-wrap:wrap}.button{min-height:38px;padding:8px 12px;border-radius:7px;border:1px solid var(--forest-2);background:var(--forest-2);color:white;font-weight:650;font-size:13px;cursor:pointer}.button:hover{background:var(--forest)}.button.secondary{background:transparent;color:var(--forest)}.button.secondary:hover{background:#edf1ea}.button:disabled{opacity:.5;cursor:not-allowed}.fineprint{font-size:12px;color:var(--muted);margin:10px 0 0}.article-count{margin:18px 0 12px;color:var(--muted);font-size:13px}.article{max-width:860px;margin:0 auto 18px;padding:26px 30px;background:var(--surface);border:1px solid #e4e3db;border-radius:12px;scroll-margin-top:92px;box-shadow:0 3px 14px rgba(36,54,44,.045)}.article-top{display:flex;align-items:flex-start;gap:12px}.article-top input{flex:0 0 auto;appearance:none;width:20px;height:20px;margin:5px 0 0;border:1.5px solid #99aa9c;border-radius:5px;background:white;cursor:pointer}.article-top input:checked{background:var(--forest);border-color:var(--forest);box-shadow:inset 0 0 0 4px white}.article-top input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.meta{font-size:12px;letter-spacing:.02em;color:var(--muted)}.article h2{font-size:21px;line-height:1.45;letter-spacing:-.01em;color:var(--forest);margin:3px 0 5px}.article p{max-width:72ch;margin:14px auto;white-space:pre-wrap;line-height:1.9;text-wrap:pretty}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:20px 0 2px}.photos figure{margin:0;min-width:0}.photos img{display:block;width:100%;height:auto;max-height:430px;object-fit:contain;background:#f1f0e9;border-radius:7px}.photos figcaption{margin-top:5px;color:var(--muted);font-size:12px}.article a{color:#315d49;text-underline-offset:3px}.empty{max-width:860px;margin:20px auto;padding:40px 24px;text-align:center;background:var(--surface);border:1px dashed #b9c6b9;border-radius:10px;color:var(--muted)}footer{max-width:860px;margin:28px auto 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}::selection{background:#cbdcc9;color:#152f26}input::placeholder{color:#596c63;opacity:1}button,select{accent-color:var(--forest)}

<main class="page">
<header class="hero"><h1>文宣作品集</h1><p>依年月整理稿件，按組別與文稿類別同步篩選；勾選作品即可建立入選集。</p><div class="public-note">公開頁面｜任何取得網址的人都可瀏覽與下載稿件及附圖</div></header>
<header class="sticky" id="stickyTools" aria-label="固定工具列">
  <div class="barline">
    <div class="brand">文宣稿件</div>
    <div class="dates"><label class="sr-only" for="year">年份</label><select id="year" aria-label="選擇年份"></select><label class="sr-only" for="month">月份</label><select id="month" aria-label="選擇月份"></select></div>

  </div>
  <div class="panel-anchor">
    <section class="dropdown browse-panel" id="filterJumpPanel" hidden aria-label="篩選與快速跳轉"><div class="browse-columns" id="browseColumns"><div id="filterPanel" class="browse-filter" aria-label="稿件篩選"><h2 class="panel-title">篩選稿件 <span class="panel-hint">組別與類別條件會同步套用</span></h2><div class="filters"><div class="field"><label for="group">組別</label><select id="group"><option value="all">全部組別</option><option value="1">第 1 組</option><option value="2">第 2 組</option><option value="3">第 3 組</option></select></div><div class="field"><label for="category">文稿類別</label><select id="category"><option value="all">全部類別</option></select></div><div class="field search"><label for="search">搜尋標題與內文</label><input id="search" type="search" placeholder="輸入關鍵字"></div></div></div>

<script>
const initial=[{"year":2026,"month":9,"label":"2026 年 9 月","source":"pCloud 2026年9月文宣座談會資料夾","entries":[{"id":"2026-09-1-文稿-1","year":2026,"month":9,"group":1,"category":"文稿","categoryNo":1,"title":"亦師亦父，伴我成長","paragraphs":["「好的開始，是成功的一半」，這一句是我的國小老師常告訴如何用來精進及勉勵自己的諺語，猶如每天起床，看見美麗的旭日，聽到悅耳的蟲鳴與鳥叫，呼吸於大自然新鮮的空氣，使心情頓時開朗了起來，亦是好的開始；整理好一天的工作行程，提著好的心情出門，成功就在眼前不遠了。另一句則是「成功的人找方法，失敗的人找藉口」，而上天是公平的，分配給每個人一天二十四小時，絕無偏心，有些人願意把時間花在修正與檢視自己的錯誤，絕不二錯，如曾子的名言「吾日三省吾身」；相反的，有些人卻時常怨天尤人、牢騷滿腹，更進一步的認為過錯都在別人，卻沒有真正的反省自己。實為可惜，又再次的失去訂正錯誤的大好機會，最終格局只能以管窺天，淪為井底之蛙。","我是中鋼電機維護人員，進中鋼之時，猶如一張白紙，毫無任何的工作經驗，就這樣的啟動職場生涯，對於電機專業，可說是一問三不知，一開始感覺人生黯淡無光，因同事們會互相做比較，提到我的時候，常問：「那個…..琮智，最近學的怎樣？L/S信號會查了？PLC程式了解了？線路圖會看了沒?還是又原地踏步？」面對大家的提問總是讓我無言以對，頓時好想鑽個洞跳進去，總覺得世界快崩塌了。回家時，經常想著如何提升自己，加強並補足自己較弱的地方。後來遇見侑哥前輩，他的年紀與我父親相近，因此說話的口吻很貼近與家人互動的模式，我跟著侑哥輪班算是最久的，前輩總是把自己的查修經驗毫不吝嗇的與我分享，有時畫圖講解，有時像說故事一樣的細水長流，把理論講得條理分明，希望的就是小跟班日後能有出息，遇見問題能當機立斷、切中要害，讓工作效率發揮的淋漓盡致。另外，如果前輩講過的我卻又犯錯，就要有被唸的滿頭包的決心。成長的路上，人無巧拙之分，唯有勤惰之別，相信勤能補拙。還有，我真的很感謝前輩能用心聆聽我微不足道的見解與想法，帶著我在中鋼留下成長的足跡，放手讓我對自己建立自信心，無所畏懼。","時光飛逝猶如白駒過隙，轉眼間前輩也近退休之年。願退休之後，身體健康，一切安好。感覺自己像在寫家書一樣。能在此相遇，也是上輩子修來的福份，應當把握且珍惜。沒有人有義務告訴你解決問題的方法，如果有，他可能是來幫助你，成為你人生中重要的貴人，應當知足且惜福，所以謝謝前輩。","在此，也不能少了雄哥前輩，他也是教會我在電機領域查修的方法，願意提點及糾正我的錯誤。感謝有二位像爸爸一樣的前輩，而我比較不會油嘴滑舌，但曾經幫助過我的人我一定銘記在心。海海人生，人生海海，毋通回頭望望著會茫，那就把目光放向今後，你有權利決定要成為什麼樣的人，過著什麼樣的生活，然後為自己認真的活一次。"],"images":[],"files":[],"source":"第1組-文稿1-亦師亦父，伴我成長"},{"id":"2026-09-1-文稿-4","year":2026,"month":9,"group":1,"category":"文稿","categoryNo":4,"title":"婆羅洲沙巴雨林生態之旅","paragraphs":["晨光初露，即將離開這個待了五天的城市，機場玻璃帷幕外，朝陽漸漸染紅天際，巍峨的「神山」（京那巴魯山）在層層雲海後浮現出龐大而沉穩的黑色剪影。雖然這次行程未能親近，但能在離境前一睹這座「東南亞第一高峰」在日出映照下的壯闊背影，已為這趟婆羅洲之行有個美好的結局。","婆羅洲（Borneo）是世界第三大島，擁有超過一億年歷史的古老熱帶雨林與豐富的生物多樣性，是全球最古老的雨林生態，全島由印尼、馬來西亞和汶萊三國管轄，是生態旅遊與自然探險的勝地。","行程自午後展開，貼心的飯店接送讓人完全不必煩惱交通。九人座專車順道經過了著名的水上清真寺（裡卡士灣浮動清真寺），湛藍穹頂與白色牆面倒映在平靜的水面上，呈現出莊嚴而寧靜的建築之美。","隨後車程一路向北，兩小時的顛頗後，來到隱密於林間的 Kawa Kawa 遊河碼頭，碼頭上已經有些許獼猴迎接，他們不畏懼外來者的眼神想必已經很清楚觀光客的習性，某團導遊分享了當地產的榴蓮，獼猴眼見大家都品嚐後，也大方去拾取帶回樹上大快朵頤起來。","穿上救生衣登船，紅樹林探索之旅正式開啟。隨著船隻輕巧穿梭在平靜的河道上，大家的眼光紛紛投向兩岸及樹梢。八月的太陽不留情的照射在靠舷邊的遊客身上，熱氣襲來，每個人仍然耐心十足得搜索著，兩岸除了幾只常見的大小猴群外，不見其他生物，在歷經了半小時的船程後，終於出現婆羅洲特有的珍稀物種——長鼻猴，正成群在樹枝間跳躍覓食。大大的鼻子與憨態可掬的模樣，讓人目不轉睛，在長鼻猴現蹤之後，彷彿開啟了野生動物寶箱，水獺一家子、水巨蜥、鸛嘴翡翠等一一出來見客，遊客們紛紛驚呼，拿起手機相機補充珍貴的畫面。","傍晚時分，搭車來到鄰近的海灘，一望無際的平坦沙灘，是許多螃蟹們的家。沙巴以「世界三大最佳落日」之一聞名，當夕陽緩緩沉入海灘底端大海深處，天空瞬間翻轉成靛紅與金黃交織的渲染畫卷。","夜幕低垂，最期待的螢火蟲河遊船終於隆重登場。船隻駛入滿天星斗映照著的漆黑河道，兩旁紅樹林點點螢光漸漸閃爍了起來，大家的情緒也隨之亢奮，當船夫揮動著小紅光，四周點點帶著微光的螢火蟲便往河面移動，甚至來到船上，停在遊客身上、手上，這份感動不是攝影器材能夠捕捉的，只能留存在此趟出遊的回憶中，為這趟沙巴生態之旅劃下最完美的句點。","長鼻猴                         翠鳥","觀光船                               水上清真寺","神山                                夕陽"],"images":[{"src":"assets/夕陽_1.jpg","caption":"夕陽"},{"src":"assets/水上清真寺_2.jpg","caption":"水上清真寺"},{"src":"assets/神山_3.jpg","caption":"神山"},{"src":"assets/翠鳥_4.jpg","caption":"翠鳥"},{"src":"assets/觀光船_5.jpeg","caption":"觀光船"},{"src":"assets/長鼻猴_6.jpg","caption":"長鼻猴"}],"files":[],"source":"第1組-文稿4-婆羅洲沙巴雨林生態之旅"},{"id":"2026-09-1-文稿-7","year":2026,"month":9,"group":1,"category":"文稿","categoryNo":7,"title":"超高齡與少子化的社會危機","paragraphs":["聯合國訂出超高齡社會的定義，我國65歲以上人口已超高20%，而全國總人數，因少子化的當下，2300萬人口的盤旋，國發會公佈，長達19個月的負成長，預言台灣五年後，人口總人數絕對低於2300萬人！","全球人口的波動，根據聯合國世界人口展望的報告指出，2023年世界人口總共80.25億人，而隔年81.6億人，僅成長1.35億人，成長速度相當緩慢，台灣人口密度排行世界第八，少子化的衝擊，2024年全球生育率，台灣是世界墊底的第一名，其次為南韓、新加坡、香港、澳門、日本等，而根據聯合國的統計，2024年居然有三成的63個國家，進入人口嚴重的衰退期，我們就是其中之一；中鋼公司高瞻遠矚，早在十六年前，2010年5月12日中鋼福委會在高雄市鳥松區澄清湖棒球場，舉辦建廠數十年來，場面最大的集團結婚活動，轟動海內外，平面媒體與電子媒體爭相報導，鼓勵大家多結婚、多生子；十六年過去了，當年結婚所生的小孩也應完成國小學業，步入國中的階段了，世界經濟的不景氣，台灣普遍存有少子化的觀念，家家戶戶幾乎都是單一後代，不再有重男輕女的觀念了，而人口的老化，高齡社會的產生，咱們鄰國的日本，就是第一個面臨的國家，台灣也將於2025年，進入高齡的社會，根據國發會的報告，65歲以上的老人，將超過全部人口的百分之二十，面對少子化與高齡化的衝擊，要有一套因應之道，是當前最重要的課題，政府與民間，不可等閒視之。","少子化的威脅，不是危言聳聽，合理的邏輯推論，若再遲續的惡化，國發會預估，2070年台灣人口數，剩下1497萬人，足足少了843萬人，而高齡化逐漸的攀昇，如此遲續的惡化，我們還需要敵人嗎？數字會數話，0到14歲孩童會減少171萬人，15歲到64歲青壯年人會減少920萬人，而65歲以上老人反而增加到248萬人，相當驚人的數據，2025年，台灣正式走入超高齡的社會，台灣65歲以上老人已超過總人口數的百分之二十，過去亞洲四小龍的風光期，今何在？台灣防疫的成功，成為世界各國讚譽有佳的典範，過程中，雖然風風雨雨，但我們擇善固執，也成功的熬過去了，面對當前少子化的威脅，主要來自經濟的壓力，為最大的因素，一間十分不起眼的公寓，購買也要千萬元起跳，初步社會的新鮮人，哪有能力來購屋？一人吃飽，全家吃飽，乾脆不婚不生，也樂得清閒，即使結婚，也選擇不生或單生一小孩，早把祖宗名言，不孝有三，無後為大，拋諸腦後，其實哪是人喜作為？而是萬分不得以啊，寶島台灣，已逐漸走入高科技的學經產業，世界先進開發國家，都在注意台灣突飛猛進的高科技發展，既然少子化的當下，就應從教育下手，讓優質或喜唸書的小孩，政府責無旁貸的讓他們有接受培育高等教育的機會，不因家庭經濟的因素，而失去就學的機會，至於不喜唸書的小孩，也該有一技之長，將來才能步入社會，成家立業，數十年過去了，政府所做，百尺竿頭，有賴再進一步，人人有工作做，就會減少作姦犯科的機會，全國總共有24個監獄，希望能改為個位數，犯人減少，監獄改制為優質公家養老院，使用者付微薄金額，由政府全力補助，回饋老人們一生對國家社會的貢獻，台灣已逐漸走向觀光產業與高科技產業趨勢，我們何仿拭目以待。","全球第一個發現老化的國家日本，已在2021年4月實施高齡者雇用法，要求業主有義務為70歲以下老人有再度就業機會，要求業主可提高退休年限或廢止退休年齡限制以及因工作內容的重要，有需要退休人員重回職場的方針，解決因出生率的下降和人口老化而造成勞動力短缺的難題；我國也警覺國人偏好早退的風氣，政府推出一套中高齡者就業促進法，鼓勵中高齡延緩退休，協助業主改變人力運用方式，讓優質高齡員工留下培育新秀，效果如何，有待進一步的觀察，再看出成效。","對於未來勞動力的缺口，國發會擬定高齡化社會財政負擔的對策規劃，少子化的危機，政府也實施0到18歲每月5000元的成長津貼補助，鼓勵大家多生育，台灣就是那麼小，政府與民間應通力合作，讓眼前少子化與高齡化的威脅，降到最低，大家加油。"],"images":[{"src":"assets/DSC_1556_1.jpg","caption":"DSC 1556"}],"files":[],"source":"第1組-文稿7-超高齡與少子化的社會危機"},{"id":"2026-09-1-剪影-3","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":3,"title":"城市的穹頂","paragraphs":["高雄車站的穹頂之下，人群沿著階梯來去，奔向各自的目的地。巨大的圓形天窗映著夜色，讓冰冷的鋼筋與水泥，也有了光的溫度。一座車站，不只是抵達與離開，也是無數段旅程交會的地方。"],"images":[{"src":"assets/城市的穹頂_1.jpg","caption":"城市的穹頂"}],"files":[],"source":"第1組-剪影3-城市的穹頂"},{"id":"2026-09-1-剪影-6","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":6,"title":"賣花女","paragraphs":["職業不分貴賤，天生我才必有用；上高速公路景觀，不同國家有不同的塲景；歐洲與亞洲分界的土耳其是販售礦泉水，臺灣則是販賣玉蘭香花；小小的玉蘭香花，掛上車，滿車芬香，一支草一點露，天無絕人之路，車陣中求生活，還是要注意安全。"],"images":[{"src":"assets/賣花女_1.jpg","caption":"賣花女"}],"files":[],"source":"第1組-剪影6-賣花女"},{"id":"2026-09-1-剪影-9","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":9,"title":"姬路城","paragraphs":["一襲純白的城牆，在湛藍天空下顯得格外耀眼。層層堆疊的屋簷、優雅上翹的飛簷，以及高聳的天守，從遠處望去宛如一隻展翅的白鷺，因此有「白鷺城」的美名。","走近姬路城，最讓人感受到的是它雄偉卻又細緻的美。潔白的城牆、古老的石頭與層層屋瓦交織在一起，每一個細節都藏著歷史的痕跡。站在城下仰望，眼前的壯麗景象，讓人彷彿穿越時光，感受昔日日本城堡的風華。"],"images":[{"src":"assets/姬路城_1.jpg","caption":"姬路城"}],"files":[],"source":"第1組-剪影9-姬路城"},{"id":"2026-09-1-剪影-12","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":12,"title":"魔戒山之路","paragraphs":["站在窄小的懸崖脊線上，兩側是深不見底的陡峭山谷，眼前直面岩石嶙峋、尖銳如巨齒般的卡迪尼山群，彷彿進入魔戒的世界。"],"images":[{"src":"assets/1000014809_1.jpg","caption":"1000014809"}],"files":[],"source":"第1組-剪影12-魔戒山之路"},{"id":"2026-09-1-剪影-15","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":15,"title":"遠眺Sassolungo","paragraphs":["多落米蒂山最知名也最特別的纜車，外觀如同直立的棺材，一次僅能搭乘2人，是來此處旅遊不可錯過的體驗。"],"images":[{"src":"assets/1000014811_1.jpg","caption":"1000014811"}],"files":[],"source":"第1組-剪影15-遠眺Sassolungo"},{"id":"2026-09-1-剪影-18","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":18,"title":"永續觀光大鵬灣獲獎","paragraphs":["座落於屏東縣東港鎮大鵬灣國家風景區，2026年榮獲環境部第十屆國家教育獎殊榮；它是早年日治時期的神風特攻隊營區，日軍戰敗撤退成養蚵區域，歷經三十年改造，生態保育的苦心經營，逐步演變成國際級旅色旅遊風景區，華麗轉身成環境永續結合經營觀光的典範。"],"images":[{"src":"assets/國際休閒特區跳水活動_1.jpg","caption":"國際休閒特區跳水活動"},{"src":"assets/遊湖艇_2.jpg","caption":"遊湖艇"}],"files":[],"source":"第1組-剪影18-永續觀光大鵬灣獲獎"},{"id":"2026-09-1-剪影-21","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":21,"title":"一舟入暮","paragraphs":["夕陽輕落海面，","將層層水紋染成溫柔的金色。","一葉朱紅，隨著晚風緩緩向前，","載著一程風景，也載著此刻的浪漫。","海天相映，暮色漸深，","原來最美的風景，","是不經意間，遇見一場溫柔的黃昏。"],"images":[{"src":"assets/一舟入暮_1.jpg","caption":"一舟入暮"}],"files":[],"source":"第1組-剪影21-一舟入暮"},{"id":"2026-09-1-剪影-24","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":24,"title":"小港漁港碼頭雨景","paragraphs":["2026年仲夏，高雄連續整整下了超過一個月的雨，時而晴天萬里，時而傾盆大雨，讓人摸不著頭緒，小港漁港碼頭座落於海邊一偶，傳統漁船整排行列，不敢出海，細雨濛濛中，按下了快門，樸實漁港風景，毫無保留的呈現在鏡頭，別有一番的風味在心頭。"],"images":[{"src":"assets/小港碼頭雨景_1.jpg","caption":"小港碼頭雨景"}],"files":[],"source":"第1組-剪影24-小港漁港碼頭雨景"},{"id":"2026-09-1-剪影-27","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":27,"title":"高雄火車站左右守護神","paragraphs":["全臺首座高雄火車站共構飯店，左邊是商業大樓，右邊是飯店旅宿，形成左右兩側的車站守護神。"],"images":[{"src":"assets/高雄車站左右守護神_1.jpg","caption":"高雄車站左右守護神"}],"files":[],"source":"第1組-剪影27-高雄火車站左右守護神"},{"id":"2026-09-1-剪影-30","year":2026,"month":9,"group":1,"category":"剪影","categoryNo":30,"title":"橫濱港都之夜","paragraphs":["夜幕降臨，","橫濱港未曾沉睡。","摩天大樓沿著水岸點亮燈火，","巨大的摩天輪在夜色中緩緩轉動，","將城市的光芒倒映在波光之間。","漫步河畔，晚風輕拂，","眼前是燈火璀璨的未來都市，","也是屬於橫濱最浪漫、最迷人的夜。"],"images":[{"src":"assets/橫濱港都之夜_1.jpg","caption":"橫濱港都之夜"}],"files":[],"source":"第1組-剪影30-橫濱港都之夜"},{"id":"2026-09-1-詩詞-1","year":2026,"month":9,"group":1,"category":"詩詞","categoryNo":1,"title":"蟹蟹 謝謝","paragraphs":["北海道的冰雪使我寒冷","無法享用毛蟹","沖繩的海鮮價令我畏懼","買不下帝王蟹","高雄的椒鹽一口蟹是為扁蟹","清脆鹹香 十分下飯","滿滿一碗 一百元整","吃得放心的螃蟹 是為好蟹","不然只吃得到新台幣的味道","謝謝爸媽讓我出生在台灣","你們的恩情比毛蟹 帝王蟹貴重許多","然而我一次用一口椒鹽蟹的大小","累積到玉山的高度","是不是還還不清呢？"],"images":[{"src":"assets/303424_0_1.jpg","caption":"303424 0"},{"src":"assets/303425_0_2.jpg","caption":"303425 0"},{"src":"assets/303426_0_3.jpg","caption":"303426 0"}],"files":[],"source":"第1組-詩詞1-蟹蟹 謝謝"},{"id":"2026-09-1-詩詞-4","year":2026,"month":9,"group":1,"category":"詩詞","categoryNo":4,"title":"玻璃球裡的永恆","paragraphs":["那一年的櫻花，","剛好開在青春裡。","風停在樹梢，","水波停在池塘，","連小貓和小狗，","都安靜地低下了頭。","世界上最慢的時間，","就停在你踮起腳尖、","吻向我的這一秒。"],"images":[{"src":"assets/玻璃球裡的永恆_1.jpg","caption":"玻璃球裡的永恆"}],"files":[],"source":"第1組-詩詞4-玻璃球裡的永恆"},{"id":"2026-09-1-詩詞-7","year":2026,"month":9,"group":1,"category":"詩詞","categoryNo":7,"title":"暗戀的風","paragraphs":["那年的風","我可憐的暗戀呀","逆風在懸崖","你用成熟溫柔澆灌她","然而你不讓她長大","單方面的喜歡","無法變成雙向來往","我們停止在認識的十字路上","交會之後 往對方走過的路前往","那一段風","幼稚的南風","讓我一天長大","你的好","體貼的言語","還在耳旁縈繞","要多久去遺忘這個盛秋？","我想 永恆的路上","不變的 是一直走下去吧！","愛你的心 陪我長大","對你的暗戀 像秋天的南風 吹過了雲 卻離開她"],"images":[{"src":"assets/311128_1.jpg","caption":"311128"}],"files":[],"source":"第1組-詩詞7-暗戀的風"},{"id":"2026-09-1-親子園地-2","year":2026,"month":9,"group":1,"category":"親子園地","categoryNo":2,"title":"皮克敏","paragraphs":[],"images":[{"src":"assets/皮克敏_1.jpeg","caption":"皮克敏"}],"files":[],"source":"第1組-親子園地2-皮克敏"},{"id":"2026-09-1-親子園地-5","year":2026,"month":9,"group":1,"category":"親子園地","categoryNo":5,"title":"銀杏葉下的昆蟲派對","paragraphs":[],"images":[{"src":"assets/銀杏葉下的昆蟲派對_1.jpg","caption":"銀杏葉下的昆蟲派對"}],"files":[],"source":"第1組-親子園地5-銀杏葉下的昆蟲派對"},{"id":"2026-09-1-親子園地-8","year":2026,"month":9,"group":1,"category":"親子園地","categoryNo":8,"title":"狐","paragraphs":[],"images":[{"src":"assets/狐_1.jpg","caption":"狐"}],"files":[],"source":"第1組-親子園地8-狐"},{"id":"2026-09-1-封底-1","year":2026,"month":9,"group":1,"category":"封底","categoryNo":1,"title":"屏東山巒","paragraphs":["雲落山腰，風過平原，","一片青綠，延伸到天邊。","遠山不語，卻收藏了南國的晴朗；","田野無聲，只讓草浪輕輕搖晃。","站在山與海之間，","看雲起、看風來，","原來最美的風景，不在遠方，","而是此刻的山巒靜靜層疊。"],"images":[{"src":"assets/屏東山巒_1.jpg","caption":"屏東山巒"}],"files":[],"source":"第1組-封底1-屏東山巒"},{"id":"2026-09-2-文稿-2","year":2026,"month":9,"group":2,"category":"文稿","categoryNo":2,"title":"遊龍行腳臺灣最美的三個小鎮","paragraphs":["臺灣最美的三個小鎮，從北到南，分別是北部的新北九份和中部的南投鹿谷以及南部的屏東恆春；遊龍親力親為，足跡踏遍這三個區塊，野人獻曝，撰之成文，與諸君分享。","●北部新北九份","新北九份是依山傍海的一個十分典型的小鎮，早年盛產金礦而有了黃金山城的美譽，電影悲情城市是由名導演侯孝賢執導，1989年拍攝，臺灣第一部榮獲國際威尼斯金獅獎的影片，故事環繞在九份這個小山城發生的歷史塵封黑幕，電視劇多情城市也以九份為主軸，描述1960年至1970年發生三位拜把兄弟的奮鬥史，讓國人直接或間接知道臺灣北部有這麼一個漂亮的小鎮。","九份是隸屬新北市瑞芳區的一個聚落，地理位置遙望基隆山，整個區塊就是座落在小小的山坡上，非常的獨特，目前居民才只一千多人，其行政劃分是瑞芳區石山里與新山里等地方，三萬五千人的瑞芳區，九份就十分凸顯它的重要性，採取開發金礦的歷史已成了過去，取而代之的觀光產業，應運而生，九份成了海內外觀光客必到之處。","九份的觀光賣點，最主要有老街美食，其美食包括芋圓、草仔粿、紅糟肉圓、油蔥粿、魚丸湯、麵食等，在茶樓品茗懷舊，吃飽喝足後，自然步道的㪚心等。","●中部南投鹿谷","南投縣是臺灣唯一沒有海邊的縣市，地理環境十分的特殊，其中鹿谷鄉更是茶鄉與森林渡假的第一首選，淡淡茶香飄揚，清爽空氣四處芬多精的森林浴，許多中部退休人潮，時常邀約親朋好友，來到大家耳熟能詳的聖地，溪頭自然教育園區，叁天老樹紅檜和大學池及空中走廊，常使人流連忘返；海拔不到兩千公尺的溪頭，隸屬臺大林管處管轄，千年神木高達46公尺，是紅檜巨木，因中空腐蝕而於2016年9月11日倒下，從此劃下了句點，卻不減每年朝聖踏青人潮，因為退休人潮年年增加，銅板價的門票，就讓人玩上一整天，遠離塵間車多人擠的窘境，何樂不為？","鹿谷鄉有個小半天風景區，是一處種滿整片孟宗竹的小村莊，是鹿谷鄉異類的世外桃園，翠綠竹林隧道，茶筍產業十分出名，遊龍調濟身心的首選，常攜家帶眷或呼朋引伴邀約渡假過夜，消磨時光，排除疲勞；休息，只為了還要走更遠的路。","鹿谷鄉轄區，還有鳳凰谷鳥園、林爽文古戰場、長源圳生態步道、德興瀑布、石馬公園等景點，十分的天然自在，旅遊一趟，絕對不虛此行。","●南部屏東恆春","2008年魏德聖執導的國片海角七號，票房紀錄高達五億三千四百多萬元，故事主軸就是描述異國情侶在南臺灣恆春半島的苦戀故事，雖是虛構的故事，再度讓人注目恆春半島的存在，事實上，恆春半島雖是觀光旅遊的重要景點，民謠歌手陳達的思想起，更與恆春半島劃上等號，而國防要地，恆春半島更是非常重要的軍事要地。","恆春鎮目前約有兩萬八千多人，一萬兩千多戶，少子化加子弟外出打拚的情況，早已跌破設鎮三萬人以上的門檻，全鎮有四個城門，建於1875年(清光緒元年)是臺灣最完整的百年古蹟，分別是東、西、南、北門；恆春落山風的環境使然，盛產的洋蔥，特別有名，風味濃郁甘美，又耐貯藏，全臺洋蔥一千三百公頃的洋蔥種植面積，恆春就占有三分之一多，年產量更高達兩萬四千多公噸，是恆春非常重要的農作物收入，爭議存廢多年的核三廠，更是臺灣經濟貢獻豐碩的臺電，設在恆春；民謠歌手陳達被學者許常惠發掘，震撼整個音樂界，一曲思想起，紅透半天邊；一年一度的中元節，恆春古城國際豎孤棚觀光文化活動在東門廣場舉行，比農曆春節還熱鬧，是地方的一大盛事，南下走走，來到臺灣最南端的恆春，洗滌身心，也是人生一樂。"],"images":[{"src":"assets/南投鹿谷溪頭_1.jpg","caption":"南投鹿谷溪頭"},{"src":"assets/屏東恆春古城_2.jpg","caption":"屏東恆春古城"},{"src":"assets/新北九份秘基_3.jpg","caption":"新北九份秘基"}],"files":[],"source":"第2組-文稿2-遊龍行腳臺灣最美的三個小鎮"},{"id":"2026-09-2-文稿-5","year":2026,"month":9,"group":2,"category":"文稿","categoryNo":5,"title":"憂友如何走過下雨的季節？","paragraphs":["每次到了六月梅雨季，我的心情總是因為一直下雨而不開心。今年的八月特別奇怪，一直有颱風陸續來臨，本來我還可以做一個新工作，結果因為一直下雨引發天氣病，持續幾天走不出家門，只好辭職，讓我很難受。不過還好我後來找到一些方法讓心情比較好，總算走過下雨的季節。","第一個方法是：找到對的人聊天。朋友有很多種，但不是每一種朋友都可以聊心事，如果有跟自己雷同經驗或者比較早熟的朋友，對我來說比較適合談心。很感謝朋友聽我訴苦，也跟我分析對方的心境可能是怎樣，讓我擔憂的心終於可以放下來。一個聽我講兩小時，一個幫我分析一個鐘頭，我很感激他們。其實憂友最需要的不是建議，往往是用心聆聽。如果一個朋友一直想給建議，可以告訴朋友：「其實我現在需要的是別人安靜聆聽就好。」也許朋友可以配合，這樣效果會比較好，朋友也不會因為想不出辦法解決而感到苦惱。","第二個辦法是打電話給1980。我有打過其他兩家的電話，但我覺得1980的老師最專業，也不用很快講完。可以跟自己第一次打完的老師約下週同一時間再討論，這樣可以省下去看諮商師的費用。之前我打去時說，我週二因為做了很多事，週三很累，就一直休息，老師問我：「你一天最多能做幾件事呢？」我算了算，說：「我好像最多只能做三件事，超過的話就會太累。」老師說：「那你以後就盡量每天排三件事以內去做吧！」通常我會跟自己進行內在談話，但有時別人可以戳破我的盲點，帶我看到自己需要調整的那一面。","第三個方法是：關心別人。我覺得在生病時關心別人，可以把轉移注意力，引到別人身上，不會一直想著自己無法做的事，而是因自己可以幫助別人而感到助人為樂的成就感。我有一個朋友也是憂友，情況比我還嚴重，我會用line跟她通話，問候她的身體情況，聽聽她最近有做甚麼努力，稱讚她做得好的地方，看到書裡有好的金玉良言也跟她分享，讓她開心。就算不是憂友，也可以聽一般朋友吐露心事。但是記得這樣的時間不能過長，不然可能會加重自己的負擔。","第四個方法是：做自己能做到的運動。在我身體好的時候，我很喜歡去大自然裡騎腳踏車，但是身體不好時，沒體力騎腳踏車。有一個朋友對我說：「我也走不出去，但是我會每天搖身體500下，有搖還是比不搖好，對吧？」所以如果你跟我一樣，生病時無法做太多運動，也可以試著做一些力所能及的輕微運動，例如：我會在床上做伸展運動，雖然每天只有做幾下，但是累積起來就變成很多下了呢！這也改善我的睡眠及增加我的柔軟度。還有我會扭動關節，天氣病會讓關節酸痛，常常扭動關節可以活動筋骨。我也會在房間裏走走，如果喜歡玩皮克敏的人可以藉著玩皮克敏，讓自己每天都活動一下。","第五個方法是：自我喊話。昨天又到了一個月回診一次的時間，我的醫生說我的情況越來越好，這次交給我一個新任務：每天看著鏡子告訴自己：「我不是以前的田謐，我現在是可以自己獨當一面的田謐。」我回來之後看著鏡子，對鏡子說了這句話，之後我就有體力做到我之前做不到的事。醫生說：「要讓自己的頭腦清晰聽到自己所說的話，讓新的信念注入，相信自己已經煥然一新，早就沒有被困在以前的心境了。」","我很感謝身邊的家人、朋友甚至醫生、專線人員都對我很好，我也希望每個人都不要忘了善待自己。雖然有時我們遇到人生的雨季，看似沒有未來，可是要記得，就算大雨來臨，我們還是可以跟大家互相撐傘，一起渡過最艱難的時光，到時必有彩虹，雨過天青，太陽綻放最誠摯的笑容，我們手牽著手，臉上帶著喜悅之情，內心溫暖又堅定。","濕漉漉的雨季，為自己和別人撐起一把傘，耐心等待雨過天青"],"images":[],"files":[],"source":"第2組-文稿5-憂友如何走過下雨的季節？"},{"id":"2026-09-2-文稿-8","year":2026,"month":9,"group":2,"category":"文稿","categoryNo":8,"title":"台東愜意之旅","paragraphs":["趁著2026 年 9 月 1 日正式上路的國旅振興方案，老伴與我搭著火車沿南迴鐵路向東前行，我們先到擁有獨特的排灣族部落風情與暖心溫泉的金崙，再到兼具了豐富的人文與美景的台東市旅遊。一路上風光明媚，尤其是東部的海景，漸層藍的太平洋與寬闊的礫石海灘，形成了東海岸最迷人的景致，隨手一拍都是令人屏息的蔚藍，光是坐在車廂內看著海浪拍岸，心情就無比舒暢。","台東縣太麻里鄉金崙村是非常美麗的村落，總面積約為 22.01 平方公里（約 2,201 公頃）。其中金崙大橋，採高架設計，橋體高達 30 多公尺，北起多良、南至金崙，沿著太平洋海岸線延伸，被譽為全台灣最美麗的高架橋之一，孕育了東海岸極具代表性的風光。","​清晨時分，我與老伴踏著微涼的海風漫步至海邊。當第一道曙光劃破天際，日出的壯麗景致盡收眼底，開啟了美好的一天。我們遠眺金崙大橋，金色的陽光灑落在浩瀚無垠的海面上，波光粼粼。開闊的視野，沉澱著清晨特有的寧靜，同時又孕育著蓬勃的生機。​到了傍晚，金崙大橋又如巨龍般橫跨沿海，向東延伸至太平洋與天際線交會處。天空堆疊著多層次的絢爛雲彩，襯托著遠方含笑的青山，山海相映、美不勝收。無論晨曦或暮色，這片天地都展現出無與倫比的壯麗景色。","此外，聞名遐邇的金崙溫泉，更是台灣東海岸極具代表性的溫泉鄉，溫泉區緊鄰太平洋與金崙大橋，其中海邊的含鐵碳酸氫鹽泉（鹹水溫泉），帶有淡淡鹹味，泉水剛湧出時呈無色透明狀，接觸空氣後，因水中的鐵質氧化反應，會沉澱出金褐色結晶，使水色轉為茶金色（日系名稱為「黃金之湯」），讓人浸泡後皮膚感覺光滑細嫩，更是其特色之一。在此，我們一邊享受著微溫舒暢的茶金色溫泉，一邊抬頭遠眺金崙大橋與湛藍無邊的海天一色。海風輕拂、泉水洗滌，旅途的疲倦瞬間煙消雲散。","之後，我與老伴來到台東市，在台東火車站前廣場，有四尊舉著「我」、「❤️」、「臺」、「東」標牌的可愛公仔裝置藝術，好像在歡迎我們。晨曦中的卑南遺址公園，則別有一番幽靜的美感。遠眺都蘭山與海岸山脈如水墨畫層疊，伴隨著清晨特有的鳥語蟲鳴，漫步在廣闊的草坪與林蔭間，輕風拂面，令人心曠神怡。在園區內參觀考古現場，親眼見證數千年前這片土地上的生活痕跡，張力十足。史前家屋復原區，則讓人得以具體想像當時新石器時代先民的居住型態與生活智慧。此外，將現代藝術創作融入自然的草坪與林地間的地景藝術，都令人流連忘返。","我覺得，這樣的慢活步調旅遊，最適合夫妻倆一同牽手漫步，​這趟行程不僅是一場極致的視覺饗宴，更有溫泉帶來的無比愜意與放鬆。點點滴滴的回憶縈繞心頭、令人回味無窮，實在是一次不虛此行的愜意之旅。","東海岸的美麗景觀","金崙大橋的美麗景觀","「我」、「❤️」、「臺」、「東」的可愛公仔裝置藝術","卑南遺址公園的考古垷場景觀","卑南遺址公園的史前家屋復原區景觀","卑南遺址公園的地景藝術景觀"],"images":[{"src":"assets/1367662_1.jpg","caption":"1367662"},{"src":"assets/1367804_2.jpg","caption":"1367804"},{"src":"assets/1368090_3.jpg","caption":"1368090"},{"src":"assets/1368130_4.jpg","caption":"1368130"},{"src":"assets/1368140_5.jpg","caption":"1368140"},{"src":"assets/292768_6.jpg","caption":"292768"}],"files":[],"source":"第2組-文稿8-台東愜意之旅"},{"id":"2026-09-2-剪影-1","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":1,"title":"雨滴","paragraphs":["意境攝影，高雄晴時多雲偶陣雨，雲中微小雲滴相互碰撞而變大，無法支撐就落下，形成大於0.5毫米雨滴，通常就是我們所稱的濛濛細雨，抓起相機拍攝，化霎那為永恆，留下珍貴回憶。"],"images":[{"src":"assets/雨滴_1.jpg","caption":"雨滴"}],"files":[],"source":"第2組-剪影1-雨滴"},{"id":"2026-09-2-剪影-4","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":4,"title":"達娜伊谷歌舞秀","paragraphs":["座落於嘉義縣阿里山鄉山美村的達娜伊谷風景區，是原住民的鄒族人聖地，玉山頌，山美情的激情表演，讓遊客安可連連；台灣發展觀光旅遊的當下，政府與業主應秉持服務之初衷，合理的旅遊價位來吸引，掃除國內比國外旅遊還貴的汙名。"],"images":[{"src":"assets/滿場人潮_1.jpg","caption":"滿場人潮"},{"src":"assets/玉山頌山美情_2.jpg","caption":"玉山頌山美情"},{"src":"assets/達娜伊谷吊橋_3.jpg","caption":"達娜伊谷吊橋"}],"files":[],"source":"第2組-剪影4-達娜伊谷歌舞秀"},{"id":"2026-09-2-剪影-7","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":7,"title":"拍攝城裡的月光","paragraphs":["國內外超過50組知名藝術家頂級聲與光及影的組合藝術品，吸引了攝影家的注目，來此臺南鹽水月津港留下題名城裡的月光作品身影。"],"images":[{"src":"assets/拍攝城裡的月光_1.jpg","caption":"拍攝城裡的月光"}],"files":[],"source":"第2組-剪影7-拍攝城裡的月光"},{"id":"2026-09-2-剪影-10","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":10,"title":"夜色淺草，初見雷門","paragraphs":["夜色下的淺草雷門，少了白日的喧囂，紅色門柱與巨大的燈籠在燈光映照下更顯莊嚴。穿過雷門，沿著仲見世通一路走向淺草寺，彷彿在繁華的東京之中，走進了一段古老的江戶時光。"],"images":[{"src":"assets/夜色淺草_初見雷門_1.jpg","caption":"夜色淺草，初見雷門"}],"files":[],"source":"第2組-剪影10-夜色淺草，初見雷門"},{"id":"2026-09-2-剪影-13","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":13,"title":"神的後花園","paragraphs":["富內斯山谷最知名拍攝日落的景點，小鎮的教堂搭配壯麗的蓋斯勒群峰，可惜當天沒等到日照金山，大自然總是會給你下次再訪的理由。"],"images":[{"src":"assets/1000013542_1.jpg","caption":"1000013542"}],"files":[],"source":"第2組-剪影13-神的後花園"},{"id":"2026-09-2-剪影-16","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":16,"title":"恐龍的背脊","paragraphs":["Seceda 是多落米蒂最知名的山，卻是非常容易抵達的景點，纜車上山走5分鐘就能讓看到宛如恐龍背脊的壯闊風景！"],"images":[{"src":"assets/恐龍的背脊_1.jpg","caption":"恐龍的背脊"}],"files":[],"source":"第2組-剪影16-恐龍的背脊"},{"id":"2026-09-2-剪影-19","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":19,"title":"東京台場之夜","paragraphs":["彩虹大橋沿著夜色延伸，璀璨燈光倒映在海面；","藍色的自由女神像靜靜佇立，彷彿守望著這座不夜之城。","遠方的東京鐵塔若隱若現，與城市燈火交織成一片迷人的光景。","東京台場的夜，橋是風景，燈是星光，","而這一刻，剛好成了最浪漫的東京。"],"images":[{"src":"assets/東京台場之夜_1.jpg","caption":"東京台場之夜"}],"files":[],"source":"第2組-剪影19-東京台場之夜"},{"id":"2026-09-2-剪影-22","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":22,"title":"恰逢此刻","paragraphs":["貓兒縱身一躍，輕巧地踏過時間的縫隙。","就在那一瞬，快門落下，留住了稍縱即逝的身影。","有些美好只存在於一瞬，就像時間，從不停留。","提醒著我們，活在當下。"],"images":[{"src":"assets/恰逢此刻_1.jpg","caption":"恰逢此刻"}],"files":[],"source":"第2組-剪影22-恰逢此刻"},{"id":"2026-09-2-剪影-25","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":25,"title":"姻緣榕樹","paragraphs":["中鋼企業工會多年來舉辦未婚聯誼，媒介了不少的佳偶，有獨無偶，高雄市三多四路有座香火鼎盛廟宇，存款超過兩億，廟埕有棵百年姻緣榕樹，信徒向榕樹祈願，報上姓名生辰八字和地址，拜託百年榕樹公賜條紅線，敲響祈願鐘，掛上祈願牌，會賜姻緣，整棵樹頭，掛滿牌子，熱鬧滾滾。"],"images":[{"src":"assets/姻緣榕樹_1.jpg","caption":"姻緣榕樹"}],"files":[],"source":"第2組-剪影25-姻緣榕樹"},{"id":"2026-09-2-剪影-28","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":28,"title":"海天之上 - 波上宮","paragraphs":["碧海輕漾，白沙鋪展成一場溫柔的夢。","海崖之上，朱紅殿宇迎風而立，","一半迎著海風，一半沐著晴光。","抬頭，是雲與藍天交織的遼闊；","低頭，是琉璃般的海水閃耀。","波聲遠去，風也變得輕柔，","唯有波上宮，靜守著沖繩最澄澈的藍。","這一刻，彷彿天地之間，","只剩一座神宮、一片海，以及此生難忘的風景。"],"images":[{"src":"assets/海天之上_-_波上宮_1.jpg","caption":"海天之上 - 波上宮"}],"files":[],"source":"第2組-剪影28-海天之上 - 波上宮"},{"id":"2026-09-2-剪影-31","year":2026,"month":9,"group":2,"category":"剪影","categoryNo":31,"title":"塗鴨景觀","paragraphs":["都市美化處處是美景，沒有人工美化，很難竟全功；座落於高雄市鳳山區經武路高雄市環保局北鳳山清潔隊旁，十分不起眼的鐵皮屋，居然整片牆壁的塗鴨景觀，吸睛程度，不多瞧一眼也難。"],"images":[{"src":"assets/塗鴨景觀_1.jpg","caption":"塗鴨景觀"}],"files":[],"source":"第2組-剪影31-塗鴨景觀"},{"id":"2026-09-2-詩詞-2","year":2026,"month":9,"group":2,"category":"詩詞","categoryNo":2,"title":"到底什麼才真正重要？","paragraphs":["那些對於生活做得到及做不到的事","我想我是有一點固執","赤裸裸的天空","總覺得要拿點彩虹來遮蓋什麼","鏡子裡的自己","卻又不敢面對疲憊失真的惟心之貌","我想我是有一點活該","自顧自的孔雀","雖然有同伴闖來","卻還是無法時刻攬住我的思慮","一盼盼綠湖也無風雨也無波","二判判憑甚麼要讓別人傷害我？","三慢慢懂得追緊或放鬆步伐","四緩緩向左微臥","五短短給自己踏出悲傷的五個步驟","六摟摟自己的肩膀不緊鎖","七回眸看看有沒有錯過流星而隕落的點滴快樂","十是實實握住己分的手","默默低頭","屋頂的角落","烏鴉也有好歌喉","披上彩霞外衣","踩著雲朵","告訴自己：最美妙的聲樂是孩童的笑聲與嬰孩的哭泣"],"images":[{"src":"assets/305043_1.jpg","caption":"305043"}],"files":[],"source":"第2組-詩詞2-到底什麼才真正重要？"},{"id":"2026-09-2-詩詞-5","year":2026,"month":9,"group":2,"category":"詩詞","categoryNo":5,"title":"鴕鳥","paragraphs":["牠把影子拖得很長，","在荒野上來回奔跑。","不像飛行，","卻比風更直接。","翅膀懷念天空，","身體只能癡留大地，","把脖子伸長探向遠方，","像在確認世界的邊界。","把頭埋進沙裡，","只為了貼近地面，","聽見我們聽不見的聲音。","在不能飛的事實裡，","讓自己活成另一種自由。"],"images":[],"files":[],"source":"第2組-詩詞5-鴕鳥"},{"id":"2026-09-2-詩詞-8","year":2026,"month":9,"group":2,"category":"詩詞","categoryNo":8,"title":"秋天開始的中鋼月餅","paragraphs":["一邊是鋼鐵的重量，","一邊是秋天的輕。","中鋼月餅，印著紅色的印記，","像工廠裡淬鍊過的歲月；","紅葉飄落在桌上，","不說話，","卻把整個秋天燒紅。","月餅是人留下的圓，","紅葉是風帶走的信。","一個來自鋼鐵之城，","一個來自季節深處；","同樣是紅，","一個寫著「堅持」，","一個寫著「告別」。","而我只在此刻明白——","再堅硬的鋼，","也有柔軟的中秋；","再短暫的紅葉，","也曾經燦爛過。"],"images":[{"src":"assets/S__54247427_0_1.jpg","caption":"S  54247427 0"},{"src":"assets/S__54247428_0_2.jpg","caption":"S  54247428 0"}],"files":[],"source":"第2組-詩詞8-秋天開始的中鋼月餅"},{"id":"2026-09-2-親子園地-3","year":2026,"month":9,"group":2,"category":"親子園地","categoryNo":3,"title":"水豚君飛魚季大冒險","paragraphs":[],"images":[{"src":"assets/水豚君飛魚季大冒險_1.jpg","caption":"水豚君飛魚季大冒險"}],"files":[],"source":"第2組-親子園地3-水豚君飛魚季大冒險"},{"id":"2026-09-2-親子園地-6","year":2026,"month":9,"group":2,"category":"親子園地","categoryNo":6,"title":"鱷魚愛上長頸鹿","paragraphs":[],"images":[{"src":"assets/IMG_5431_1.jpeg","caption":"IMG 5431"}],"files":[],"source":"第2組-親子園地6-鱷魚愛上長頸鹿"},{"id":"2026-09-3-文稿-3","year":2026,"month":9,"group":3,"category":"文稿","categoryNo":3,"title":"食安筆記：3類值得關注的加工污染物與食品添加物","paragraphs":["一、 前言","近年來，多起重大食品安全事件，從早期的塑化劑、地溝油，到近期的苯駢芘事件，都讓國人更加重視食品安全與食品成分。走進超市，筆者也逐漸養成查看食品成分標示的習慣。然而，現代食品工業日益發展，食品從原料到成品的過程中，除了食品添加物之外，也可能因製程所產生的加工污染物。面對陌生的成分表，究竟哪些成分值得我們特別留意？筆者將自身研讀食品安全的資料，將心得整理成文，與讀者分享。","食品添加物在現代食品製造中具有保存、穩定、加工及改善口感等功能，並非只要添加就具有危害。然而，長期或過量攝取加工食品或食品在製程中產生的加工污染物，就可能演變成值得關注的食安議題。因此，除了大眾較熟悉的加工肉品與亞硝酸鹽之外，消費者也可以進一步了解其他常見於加工食品中的成分與加工污染物，認識其用途及可能存在的健康風險，進而做出更聰明的選擇。","二、3類值得關注的加工污染物與食品添加物","1. 縮水甘油脂肪酸酯 & 3-單氯丙二醇酯","與近期大眾所熟知的苯駢芘相似，縮水甘油脂肪酸酯( GEs )與3-單氯丙二醇酯( 3-MCPDEs )皆為植物油精煉過程中的加工污染物。透過模擬胃腸道模式系統發現，上述兩種物質經身體消化，分別會被水解釋出游離態的 縮水甘油與 3-單氯丙二醇，前者被世界衛生組織國際癌症研究機構（IARC）歸類為 2A 級( 很可能致癌 )，後者則被歸類為 2B 級( 可能致癌 )。","2016 年歐洲食品安全局（EFSA）之科學報告中亦指出該污染物，在精煉棕櫚油中含量最高。棕櫚油因價格便宜、耐高溫且性質安定，被廣泛使用於泡麵、餅乾零食、巧克力與油炸食品中，故消費者選購時可多加留意，優先選擇較少使用精煉棕櫚油的產品，以降低 GEs攝入的可能性。值得注意的是，台灣衛生福利部，參酌國際管理現況及國內外相關風險評估資訊，增訂食用油脂中 GEs 之限量規定，並已於 2024 年 1 月 1 日正式實施  (1) (2)。","​ ​2. 添加糖：高果糖糖漿與大量蔗糖","​糖是人體重要的能量來源，但問題在於日常飲食中經常攝取過量的添加糖。高果糖糖漿、蔗糖等常被添加於含糖飲料、甜點、糕餅及各式加工食品中，若長期大量攝取，容易造成肥胖、增加血脂異常、胰島素阻抗及第二型糖尿病等代謝問題的風險。其中，高果糖糖漿中的果糖主要由肝臟代謝，當攝取量過高時，促進肝臟脂質新生，增加三酸甘油酯生成，也與脂肪肝及發生代謝異常有關。","因此，控制日常添加糖的總攝取量，含糖飲料、甜點及高糖零食不宜成為日常飲食的主要來源，若能以無糖飲品、低加工食品取代部分高糖加工食品，更能有效降低長期過量攝取所引發的疾病風險 (3) (4)。","​3. 磷酸鹽類","磷酸鹽類食品添加物廣泛使用於加工食品中，常見於火鍋料、重組肉、海鮮。它能增進火鍋料、重組肉的成形與膠結，或是增加海鮮的保水性，使其外型更為膨大，獲得更佳的賣相。然而，天然食物中所含的有機磷，人體腸道吸收率僅約 40%～60%，但食品添加物中的無機磷，吸收率卻可高達 90% ~100%。據消基會的資料顯示，依照國人「每日飲食指南」所建議的飲食內容來估算，每日從天然膳食攝取的磷約為1,305毫克，若再加上來自食品添加物中的磷，攝取量恐會超標，達每日建議量的兩、三倍以上。","一項 2010 年針對抗衰老基因與磷酸鹽對老鼠壽命影響的研究，以及對血液透析患者死亡率的觀察均發現，高磷是造成體內器官提早老化的原因。若長期大量攝取，尤其是對於腎臟疾病患者，更需特別小心，故消費者購買時，可以留意成分標示中的磷酸鹽、焦磷酸鹽、多磷酸鹽等名稱，可優先選擇添加物較少、加工程度較低的產品 (5) (6)。","​三、提升食安知識與選購智慧","​食品添加物並非洪水猛獸，許多添加物在食品製造、保存及運輸過程中具有其必要性，真正值得我們關注的是，長期且大量攝取，以及加工製程中可能產生的污染物，與其拒絕所有加工食品，倒不如從日常選購中著手，降低不必要的攝入，並拉高日常飲食中原型食物比例，嘗試接受天然食物的樣貌，不過度追求其外觀與口感。","​","​最後我想說，如果大家多看一眼成分表、多比較一項原料，或許只是多個幾秒鐘，卻能讓我們對自身與家人的飲食，多一分掌握！","文獻參考","(1) 許芷寧、蔡欣亞、蘇南維（2018）。精煉食用油中熱加工汙染物3－單氯丙二醇酯和縮水甘油酯之生成、毒性與分析方法。臺灣農業化學與食品科學，56(6)，173-180。https://doi.org/10.6578/TJACFS.201812_56(6).0004","(2) 食品藥物管理署（2022）。預告增訂食用油脂中縮水甘油脂肪酸酯之限量標準。衛生福利部。https://www.mohw.gov.tw/cp-5264-65832-1.html","(3) 楊榮森（2022）。加糖飲料是健康的殺手。健康世界，(543)，12-13。https://www.airitilibrary.com/Article/Detail?DocID=16077059-202203-202203240009-202203240009-12-13","(4) 林淑芳（2023）。健康生活型態與拒糖飲行為之相關性探討。健康管理學刊，21(1)，27-51。https://www.airitilibrary.com/Article/Detail?DocID=18111947-N202401030002-0000","(5) 財團法人中華民國消費者文教基金會 (2018年03月14日)。市售食品磷酸鹽含量檢測報告。新聞發佈。https://share.google/DDfDgp2qin1fCS7Ln","(6) 姜至剛 ( 2016 ) 。磷酸鹽讓你提早初老報到！。台大醫院健康電子報。","https://epaper.ntuh.gov.tw/health/201611/special_1_1.html"],"images":[],"files":[],"source":"第3組-文稿3-食安筆記：3類值得關注的加工污染物與食品添加物"},{"id":"2026-09-3-文稿-6","year":2026,"month":9,"group":3,"category":"文稿","categoryNo":6,"title":"百大咖啡廳的饗宴 - Tomorrow Coffee Roasters","paragraphs":["平矮的樓房們，在棋盤式規劃的街道上排列，靜謐的社區氛圍與周遭車水馬龍的城市喧囂彷彿兩個世界。黎明新村，是台灣歷史洪流中的特殊產物 – 眷村，在台灣眾多眷村逐漸登出的趨勢裡，仍保存著質樸的眷村樣態。","騎著摩托，在黎明新村的巷弄中找尋，那是甫獲世界百大咖啡廳殊榮的店家，也是台灣惟四入選百大的咖啡廳之一 - Tomorrow Coffee Roasters。循著地址滑進巷弄中，夾在兩棟平房中的日風宅邸，顯眼亦不易錯過。","那是一棟眷村老宅改建的建物，以日式傳統屋瓦重塑的兩層樓建築，門前以碎石鋪地搭配綠植建構微縮枯山水的庭園意境。推開銀亮的門扉，溫潤的木質吧台擺放各式各樣的沖泡工具，咖啡師們似對待自己孩子般優雅細心地烹煮著咖啡。","Tomorrow Coffee能接待客人的位子不多，除一樓吧檯區數個座位外，拾階來到二樓，僅客人得共用之一長方形桌子，沒有其他多餘的配置。","等待咖啡之餘，環視周遭，咖啡廳刻意保留了舊建築結構與斑駁的洗石子地板，以其最原始的肌理陳述著建物的舊故事。在舊物之上，帶入了日式侘寂(Wabi-Sabi)的審美觀，以享受世間萬物在其最自然的形態中所展現的不完美之美的概念建構了咖啡廳的內涵。","點了杯 Tomorrow Blend Café Latte佐以法式甜品可麗露(Cannelé)，待咖啡師呈上並簡單的說明咖啡的品味法。單品手沖的層次感，讓玻璃杯裡的latte呈現著藝術品的質感，循建議先大口喝下，先是咖啡的苦澀沖擊味蕾，隨後包含著牛奶香味的回甘在口舌處迴盪。可麗露厚實硬脆的外皮下，內部卻是蜂巢狀軟潤的樣貌，那種口感衝突性不亞於喝下咖啡的那一瞬間。","在侘寂的不完美中，Tomorrow Coffee首先以空間氛圍留人，接著以手沖咖啡飄逸的香氣與自家烘焙甜品的味覺驚豔訪客，或許時間就該浪費在這麼美好的時空中，我由衷想著。","The world's best 100 coffee shop               咖啡單品與甜品","侘寂禪風"],"images":[{"src":"assets/The_world_s_best_100_coffee_shop_1.jpg","caption":"The world's best 100 coffee shop"},{"src":"assets/侘寂禪風_2.jpg","caption":"侘寂禪風"},{"src":"assets/咖啡單品與甜品_3.jpg","caption":"咖啡單品與甜品"}],"files":[],"source":"第3組-文稿6-百大咖啡廳的饗宴 - Tomorrow Coffee Roasters"},{"id":"2026-09-3-文稿-9","year":2026,"month":9,"group":3,"category":"文稿","categoryNo":9,"title":"握們","paragraphs":["因為我自認為自己是一個極度不完美，缺乏安全感的人，所以如果有人對我推心置腹，我都會極其感動不已。今天知道我寫菜的文章要登上了，令我雀躍不已。菜是我在日本最好的友人，已經是比家人還更貴重的存在，我覺得她像另一個在日本生活的我，另一個在地球那一方，用著不同思維模式，相同抑或互補的存在。","這篇文章已經是好久以前寫的了。我寫關於菜的文章，通常都是在半夜寫成的，因為思念成疾而振筆疾書。還好現在年紀多了幾歲開始注重早睡了，所以現在雖是夜晚，也還沒超過敲醒灰姑娘美夢的十二點鐘。上個月的我，好像活在一個真實進行式的美夢中，幾乎每天都很有活力，每天都可以出去，每天都可以做很多事，對於一個被媽媽說，假如做月子期間一定也會每天出去趴趴走的人來說，要當宅女根本是天方夜譚的事！","我喜歡大自然，喜歡游泳，喜歡探險，喜歡騎腳踏車穿梭於港都每一個讓我驚喜連連的小角落。去一家餐廳前不看評價，等餐前來自己帶的書出來悅讀，做世界上獨一無二的手工藝品，開心找構圖的方向，為意外拍出好看的照片而歡喜不已......世界上有許許多多想要嘗試的新事物，沒有學過的都想學。然而一直下雨讓我得了天氣病，使我在床上動彈不得。那樣的無所事事，那麼疲倦不堪，實在我是我這種個性的人，難以忍受一時一秒的。","有時候，生命就是會把妳停格在某個瞬間，讓妳細細咀嚼自己，是否不知不覺地吸收了太多壓力。不管是活力充沛的鮮明時刻、難過憂愁苦悶時分，菜都在。開心時為我欣喜不已，傷心時為我擔憂難過。總是在我歡笑時替我錦上添花，悲傷時為我雪中送炭。我覺得我們不夠有力，要稱作「握們」。握住彼此的手，握住彼此的愛與負擔，握住那兩顆真摯的心，握住握們美好的過去、現在與未來。","我曾經帶妳及朋友去旗津海邊，2017年妳剛來高雄。那時的妳中文還不是很好，也鬧了不少笑話。2026年的今天，跟朋友在府城的黃金海岸的秋天，拍著日落西海的金黃橘色澤美景，配上一波波往自身流動的海浪。","妳用line上兩隻可愛棕色及白色的狗，像一對朋友靠著彼此的手比讚，妳回覆訊息的速度很快，不像妳國之人通常都很緩慢，我很感動。我們將彼此放在心上，幾乎每天都關照對方的大小事。最近，我因為跟妳國之人聊天，覺得他的回答措辭竟然可以如此溫柔體貼，讓我有種被細心呵護的味道。","我：我覺得他太溫柔，我不能再傳訊給他。","菜： 為什麼太溫柔就不行呢？","我：會很喜歡他，但是他並沒有說他喜歡我 ，這樣很痛苦。","菜：妳告訴他，我喜歡你了嗎？","我：沒有。","菜：最近的男性好像大多都比較害羞，對不對？","我：不知道耶！但是我感覺不出他有喜歡我，所以我不想表白。","菜：是喔…真的很難。：”（","15分鐘後......","我：我傳訊給他說，我覺得你太溫柔，我不能再傳訊給你，我覺得很難過。他已讀未回。","25分鐘後......","我：他說：「謝謝妳願意鼓起勇氣，這麼誠實、坦白地告訴我妳的心意。關於交往，很抱歉我並沒有這樣的心意，一直以來我都是把妳當作姊妹。我很理解妳的心情，也完全尊重妳的決定。那我們就先暫停私底下的聯絡，讓妳有足夠的空間沉澱。謝謝妳的心意。」","我的回覆：「謝謝你，因為我沒有感覺到你喜歡我，但是越認識你會讓我越喜歡你，這樣我會很難受，但是可以成為弟兄姊妹，也許就足夠了。還是很謝謝你這段時間的安慰與鼓勵，我還是希望你能更喜樂地過生活，願你有喜樂和勇氣與力量。」終於釐清了，好開心！XD","菜：只願妳過得幸福。","跟菜商量時，總覺得難整理的思緒，一下子變得很好懂。而不管怎樣，菜永遠會站在我身邊，為我著想。謝謝菜，在這漫漫長夜裏，因為妳在我記憶中鮮明跳動著，我們的思緒，逐漸跟對方調成一致。祈願有著同樣夢想、使命必達的我們，在人生急轉彎需要慢下來的地方，繼續關注彼此、互相打氣。這樣「握們」，才能握住真正的生命！","妳像夕陽暖著我心"],"images":[{"src":"assets/312805_1.jpg","caption":"312805"}],"files":[],"source":"第3組-文稿9-握們-梁中悅"},{"id":"2026-09-3-剪影-2","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":2,"title":"洗心","paragraphs":["看著眼前的楓葉與古老的木造建築，時間彷彿也慢了下來。沒有太多聲音，只有風吹過枝葉的細碎聲響。也許旅行的意義，不只是去看見更多風景，而是在某一個瞬間，讓自己的心重新變得安靜。","一樹楓色，幾筆「洗心」，願走過此處的人，都能帶著一點平靜，再繼續前行。"],"images":[{"src":"assets/洗心_1.jpg","caption":"洗心"}],"files":[],"source":"第3組-剪影2-洗心"},{"id":"2026-09-3-剪影-5","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":5,"title":"夢時代迴旋梯","paragraphs":["高雄市夢時代購物中心，內部以迴旋梯吸客，頂樓以高雄之眼摩天輪為著名地標，是全臺最大的購物中心之一。"],"images":[{"src":"assets/夢時代廻旋梯_1.jpg","caption":"夢時代廻旋梯"}],"files":[],"source":"第3組-剪影5-夢時代迴旋梯"},{"id":"2026-09-3-剪影-8","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":8,"title":"博多祭典的記憶","paragraphs":["走進福岡櫛田神社，高聳的山笠以精緻的人偶、鮮明的色彩與層層堆疊的浪花為主題，彷彿將博多祇園山笠祭典的熱鬧與歷史凝結在眼前。這項擁有數百年歷史的傳統祭典，是博多最具代表性的文化之一。","抬頭望去，古老的山笠與藍天、綠意交織；那一刻，眼前的不只是神社，而是一座城市將信仰、歷史與生活延續至今的模樣。"],"images":[{"src":"assets/博多祭典的記憶_1.jpeg","caption":"博多祭典的記憶"}],"files":[],"source":"第3組-剪影8-博多祭典的記憶"},{"id":"2026-09-3-剪影-11","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":11,"title":"大自然的望遠鏡","paragraphs":["位於義大利多落米提山區的三尖峰，從山洞向外拍出去，就像從望遠鏡裡觀賞這座雄偉的大山。"],"images":[{"src":"assets/1000014821_1.jpg","caption":"1000014821"}],"files":[],"source":"第3組-剪影11-大自然的望遠鏡"},{"id":"2026-09-3-剪影-14","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":14,"title":"棺材纜車","paragraphs":["多落米蒂山最知名也最特別的纜車，外觀如同直立的棺材，一次僅能搭乘2人，是來此處旅遊不可錯過的體驗。"],"images":[{"src":"assets/1000013195_1.jpg","caption":"1000013195"}],"files":[],"source":"第3組-剪影14-棺材纜車"},{"id":"2026-09-3-剪影-17","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":17,"title":"日本函館百萬夜景","paragraphs":["天色慢慢暗下來，","函館把燈一盞一盞點亮，像星光落在大地。","山頂比想像中熱鬧，人群肩並著肩，","人聲鼎沸，個個都在等待夜色完全降臨。","有人舉起相機，有人靠著欄杆，只為搶下一個最好的位置，","當燈火終於在眼前鋪展開來，喧鬧聲也成了這座城市的一部分。","我擠在人群中，沒有急著拍下這片夜景，","只想多站一會兒，","讓眼前的萬家燈火，在記憶裡繼續亮著。"],"images":[{"src":"assets/1.函館百萬夜景_1.jpg","caption":"1.函館百萬夜景"}],"files":[],"source":"第3組-剪影17-日本函館百萬夜景"},{"id":"2026-09-3-剪影-20","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":20,"title":"天際歸途","paragraphs":["夕光落在城市邊，","晚風輕輕越過水面。","一抹飛影掠過天際，","帶著未說完的遠方。","暮色漸深，萬家燈起，","而天邊仍留一抹溫柔。","原來最美的告別，","不是落日，而是奔赴下一程。"],"images":[{"src":"assets/天際歸途_1.jpg","caption":"天際歸途"}],"files":[],"source":"第3組-剪影20-天際歸途"},{"id":"2026-09-3-剪影-23","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":23,"title":"璀璨華章—澳門倫敦人","paragraphs":["夜幕低垂，華燈初上，恢弘建築沐浴在流金光芒中。","典雅的輪廓，層層堆疊，雕琢出如宮殿般的壯麗與氣派。","遠望如一座不夜的華麗城堡，在澳門夜色裡，綻放耀眼光芒。","繁華凝於一瞬，光影成就永恆，","而眼前這座璀璨地標，正是夜色裡最令人屏息的風景。"],"images":[{"src":"assets/璀璨華章_澳門倫敦人_1.jpg","caption":"璀璨華章—澳門倫敦人"}],"files":[],"source":"第3組-剪影23-璀璨華章—澳門倫敦人"},{"id":"2026-09-3-剪影-26","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":26,"title":"歲月簷下","paragraphs":["斑駁的木窗，留住歲月的痕跡，","陽光沿著老屋的輪廓落下，","一枝新綠悄悄伸展，","穿過古樸的木紋與靜謐的光影。","老屋不語，卻在一窗一木之間，","藏著時光走過的溫度。"],"images":[{"src":"assets/歲月簷下_1.jpg","caption":"歲月簷下"}],"files":[],"source":"第3組-剪影26-歲月簷下"},{"id":"2026-09-3-剪影-29","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":29,"title":"東京歌舞伎座","paragraphs":["東京銀座街頭，","車流穿梭，繁華不息，","一座歌舞伎座靜立其中，","以純白殿堂與層疊屋簷，","映照出濃厚的日本傳統之美。","古典建築與現代城市交錯，","一眼望去，彷彿穿越時光，","在繁華東京之中，","留下最優雅的一幕。"],"images":[{"src":"assets/東京歌舞伎座_1.jpg","caption":"東京歌舞伎座"}],"files":[],"source":"第3組-剪影29-東京歌舞伎座"},{"id":"2026-09-3-剪影-32","year":2026,"month":9,"group":3,"category":"剪影","categoryNo":32,"title":"夏日午後","paragraphs":["陽光落進湛藍的水面，","白雲在晴空裡緩緩散開。","風掠過泳池邊，","也吹淡了午後的喧囂。","那一刻，","夏天沒有遠方，","只有一池藍，","和被陽光輕輕收藏的時光。"],"images":[{"src":"assets/夏日午後_1.jpg","caption":"夏日午後"}],"files":[],"source":"第3組-剪影32-夏日午後"},{"id":"2026-09-3-詩詞-3","year":2026,"month":9,"group":3,"category":"詩詞","categoryNo":3,"title":"第一聲","paragraphs":["你還來不及認識世界","世界卻已經","先聽見了你的哭聲","小小的拳頭握著光","濕漉漉的髮尾","像剛游過一場漫長的海","透明的箱子裡","躺著一個新的宇宙","而我終於明白","原來所謂的勇敢","是你睜開眼睛的那一刻"],"images":[{"src":"assets/第一聲_1.jpg","caption":"第一聲"}],"files":[],"source":"第3組-詩詞3-第一聲"},{"id":"2026-09-3-詩詞-6","year":2026,"month":9,"group":3,"category":"詩詞","categoryNo":6,"title":"〈擦身〉","paragraphs":["期盼與你相遇，","在湛藍映照之中，","海潮氣息環繞巷弄，","順著長堤蔓延時，也許…","是你留下的足跡；","錯過與你相遇，","在嶙峋礁岩之間，","浪花低語柔聲吟唱，","游離似墨青藻時，也許…","藏匿著你的背影；","山風墜在遠處，凝雲成雨，","拍散你背上的溫度，","於是尋覓更深沉的寂靜，","遺落了呼喚…","山風劃過耳畔，輕撫髮梢，","搖動砂殼串起的鈴，","拼湊歪斜字體刻上約定，","盼能邂逅這四季如春的城。"],"images":[],"files":[],"source":"第3組-詩詞6-〈擦身〉"},{"id":"2026-09-3-親子園地-1","year":2026,"month":9,"group":3,"category":"親子園地","categoryNo":1,"title":"森林裡的啄木鳥","paragraphs":[],"images":[{"src":"assets/Woodpecker_1.jpg","caption":"Woodpecker"}],"files":[],"source":"第3組-親子園地1-森林裡的啄木鳥"},{"id":"2026-09-3-親子園地-4","year":2026,"month":9,"group":3,"category":"親子園地","categoryNo":4,"title":"小雪人的繽紛星空夜","paragraphs":[],"images":[],"files":["assets/第3組-親子園地4-小雪人的繽紛星空夜.pdf"],"source":"第3組-親子園地4-小雪人的繽紛星空夜"},{"id":"2026-09-3-親子園地-7","year":2026,"month":9,"group":3,"category":"親子園地","categoryNo":7,"title":"海底相遇","paragraphs":[],"images":[{"src":"assets/海底相遇_1.jpg","caption":"海底相遇"}],"files":[],"source":"第3組-親子園地7-海底相遇"}]},{"year":2026,"month":10,"label":"2026 年 10 月","source":"2026年10月待審稿件","entries":[{"id":"2026-10-1-文稿-1-1","year":2026,"month":10,"group":1,"category":"文稿","categoryNo":1,"title":"隱藏在冰山下的隱憂—當圓融成為一種文化","paragraphs":["在產業快速變動與AI技術迅速發展的時代，各產業皆面臨人才培育、留任與人力配置的挑戰，即便是被大眾奉為「鐵飯碗」的國營、泛國營企業也不例外。中鋼被多數人視為南部首屈一指的幸福企業，在過往招考時也總是吸引眾多人才前來應試。然近年因受到全球鋼鐵市場變化、國際貿易情勢、碳稅制度與通膨等因素影響，鋼鐵產業的經營也面臨嚴峻的考驗，讓許多人心中悄悄埋下不安的種子，甚至果斷退出，往高科技產業發展。然而，表面上看似是因為產業薪資結構失衡所造成的人才流失，背後可能還潛藏著更深層的隱憂。","相對穩定的工作環境與薪資制度，一直是中鋼吸引人才的重要優勢。然而，當組織長期處於高度穩定的環境，也可能衍生另一種值得關注的現象：中鋼組織階層分明、專業分工細緻，多數同仁只要完成職責範圍內的工作，便能獲得相對合理的報酬；當面對主管額外交辦的任務、新增業務，或跨越既有分工的工作時，部分同仁可能因職責界線、工作負荷或既有習慣，而傾向避免承擔。當少數同仁願意主動承擔、勇於當責、持續改善工作方式時，這樣的積極表現有時未必能獲得正向回饋，甚至可能因為打破既有工作模式，而受到他人異樣的眼光或無形壓力。","孔子說：「鄉愿，德之賊也。」當組織文化逐漸形成安於現狀、避免改變的氛圍時，那些願意主動承擔、努力解決問題的同仁，反而可能漸漸被視為異類，久而久之，組織中便可能形成劣幣驅逐良幣的現象。當積極任事逐漸被解讀為「內捲」，甚至成為勸阻他人投入的理由時，原本應該受到鼓勵的積極性，反而可能被貼上負面標籤。久而久之，部分有志者因長期受到無形壓力，心中產生沉重的負擔，逐漸降低投入，甚至選擇隨波逐流；而仍不願放棄原則者，則得在缺乏支持的情況下長期獨自奮鬥，最終筋疲力盡，甚至選擇離開、另覓發展。如此循環下來，不僅延攬人才有困難，也可能讓更多願意投入的同仁逐漸降低工作的熱忱。","面對這潛藏在冰山下的隱憂，管理者扮演著關鍵的制衡角色。《孫子兵法》提到：「將有五危：必死，可殺也；必生，可虜也；忿速，可侮也；廉潔，可辱也；愛民，可煩也。凡此五者，將之過也，用兵之災也。」愛護部屬本身並沒有錯，但若將「圓融」置於公平與原則之上，管理者便可能因人情壓力而難以做出必要的管理決策。若領導者為了維持表面的和諧，而對工作表現怠慢的情形缺乏適當的提醒與管理，或對積極任事的同仁所承受的外在壓力缺乏關注，久而久之，反而可能讓組織中的失衡現象持續存在，表面上看起來一團和氣的氛圍，實則潛藏著人才流失的隱性風險。","在這個人才競爭日益激烈的時代，延攬人才固然重要，但珍惜人才亦不可忽視。「智者之慮，必雜於利害。」真正有智慧的人，不是一味地追求表面的和諧，而是要能審時度勢、明辨是非、權衡利弊。鄉愿之所以值得警惕，並不在於其表面上的圓融與和善，而在於當「不得罪人」成為最高原則時，可能反而模糊了是非的界線，更可能成為使人才流失的潛在因素。對於組織中的「鄉愿」現象，不論是領導者或是仍願意積極任事的同仁，都應該意志堅定，保持原則與判斷，在追求圓融的同時，也不宜因此犧牲對事情是非與合理性的思考。真正的善良與正直，帶有鋒芒，能在面對不合理的現象時，仍願意理性地提出問題；在面對錯誤時，仍有勇氣善意指正；在面對壓力時，仍能守住自己的原則。所謂的「積極任事」，也不應等同於毫無節制地增加工作量，更不能以個人表現去要求所有人採取相同的工作方式。真正健康的組織文化，應該是在合理的制度下，讓願意承擔的人得到肯定，也讓每一位同仁都能在自己的職責中發揮所長。","楊理事長在今年四月蒞臨敝單位，並於會議上分享道：「未來將推動績效導向之調薪策略，同時改善大樹下好乘涼之風氣，強化組織積極度。」這番談話對於許多願意積極任事的同仁而言，無疑帶來了正面的鼓舞，也讓人看見組織對於改善既有文化的決心。由此可見，冰山下的問題已逐漸受到關注，而千里馬的抱負，也仍有伯樂願意看見。期盼有志者能持續保持踏實當責之心，領導者亦能成為有志者最堅實的後盾，珍惜人才，讓中鋼留住人才，穩健前行、更上層樓。"],"images":[],"files":[]},{"id":"2026-10-2-文稿-2-2","year":2026,"month":10,"group":2,"category":"文稿","categoryNo":2,"title":"阿嬤，有妳真好","paragraphs":["「哥，阿嬤清晨五點四十四分安詳的離開人世了。」手機遠方傳來了妹妹忐忑不安的一句話，當時睡眼惺忪的我還沒回過神，但眼角的淚水早已很不爭氣，滴答、滴答的掉了下來，我的內心頓時被這排山倒海的意外衝擊了一次又一次，「阿嬤……離開了。」我還是不敢相信會發生這樣的事情，打得我措手不及，那天是禮拜五，早上向公司請了假，便回到了台南的家。","「阿智，放學回來了啊！阿嬤有煮你愛吃的火鍋，趕快去刷牙洗手，然後來吃飯。」阿嬤輕聲細語的對我說著。回憶起阿嬤的火鍋餐總是那麼的琳瑯滿目、美不勝收，有我愛吃的肉片、蔬菜，每次都可以讓我吃的津津有味，配上好幾碗白飯。從小「家的味道」就是這樣一點一滴的累積形成，如今我還是很懷念有阿嬤在的時候，讓我衣食無憂。阿嬤常常掩口偷笑的對我說：「你小時候很潔癖，一滴如珍珠般細小的水滴滴到褲子你就脫掉，甚至還有連內褲都不穿的案例。喔！對了，有一次逛夜市，你還真的一絲不掛，當時大家都在看你。」其實我還真不知道有這檔事，如今被阿嬤提起，真是讓我面紅耳赤、無地自容。","阿嬤的觀念較傳統、守舊，當時阿嬤的年代較偏向重男輕女，有時妹妹會對我抱怨：「哥！阿嬤偏心，為什麼你的雞腿比較大隻？為什麼你的荷包蛋面積比較大？……等等。」阿嬤總會理直氣壯的說：「男孩子以後是要撐起整個家，是家裡面的支柱、棟樑，不多吃點，怎有力氣抗起重擔？」我聽媽媽說當年她把我生下的時候，阿公和阿嬤高興的跟中樂透似的，喜出望外的到處與鄰居報告生了男丁，甚至開心到晚上睡不著覺。","憶起上大學時，我的第一台摩托車是阿嬤買給我的，它讓我能與朋友、同學徜徉在屏科大這若大的校園，不管是上課、出遊、夜唱……等等我都需要用到它。如今我還是很感謝阿嬤送我如此方便的代步工具。大學畢業及當完兵後，最讓阿嬤坐臥不安的就是我的人生課題—找工作。當時報考了捷運公司，筆試放榜那天，開心的跟阿嬤說我進了面試，阿嬤話不多說便買了一套帥氣的西裝給我，並且摸摸我的頭說：「孫ㄟ，面試要加油喔！」後來阿嬤也得知我考進中鋼，開心的與姑姑們分享，並希望自己的外孫也能把握住這樣的機會。","晚年阿嬤得了失智症，已經嚴重到不能自理，家中也請了長照機構幫忙阿嬤洗澡及輔助阿嬤吃飯。阿嬤總會把媽媽當成是自己的女兒，有時會吵著要回老家，也經常把陽台誤認成是一片魚塭，說是要去捕魚。我知道這一切的結果不是阿嬤願意的，只是大腦退化了。阿嬤的房間在三樓，上樓梯轉角處就到了，每次我有回家時，經過阿嬤的房間，我都會探頭探腦，檢查阿嬤有沒有在房間，但多半的時間阿嬤都躺在床上，有時會不經意的把雙腳放在床外懸空，讓我匪夷所思。","最後一次與阿嬤見面是在台南奇美醫院，那天與媽媽、妹妹一起去醫院看阿嬤，當時阿嬤的眼睛仍炯炯有神，眼球像個雷達，似乎在搜尋著某樣東西，看到我來，變得更激動了，當時我牽著她的手，並且在心中說著：「阿嬤別怕，放心，有我在！」當時阿嬤並沒有戴呼吸器，但是已經不會說話了，媽媽摸了阿嬤的額頭，似乎告訴她妳要好好加油，妳的孫子都在這裡。那天我左看右看了阿嬤的病房，房內混雜了厚重難聞的藥水味，隔壁的病床拉起了布簾，當時的我也沒心情知道那是誰，只希望阿嬤能身體健康，之外的並無所求了。","在阿嬤過世後，請了身披道袍的道士，做了法會，念誦經文，讓功德回向阿嬤。那天，禮儀社的人將阿嬤從殯儀館地下室推了出來，當鑲有經文的布條被掀起時，所有的人都哭紅了眼，阿嬤的面容如此和藹安詳，像個小孩睡著了一樣，只是這一次比較不同，是不會再醒來了。接下來接連數天的儀式，折金條、元寶及蓮花金，我跟媽媽、妹妹、姑姑們一起同心協力完成。焚香的味道充滿整個靈堂，靈堂前的供桌擺滿了阿嬤喜歡的百合花，走道左右則是放置了連一點位置都不剩的花柱，時而阿嬤的兄弟姊妹來上香，也是拜著拜著眼眶就紅了。這幾天下來折了好幾十袋的金條、元寶，我也向中鋼公司及工會申請了電子輓聯及花柱，希望阿嬤能看得到。告別式的最後一天，我小心翼翼捧著阿嬤的骨灰罈，一路上說著：「阿嬤要過橋了，請小心；阿嬤我要開車門了，請祢小心下車。」到了納骨塔，我跟阿嬤說祢要跟阿公團圓了，放寬心，跟著佛祖去修行。離開納骨塔前，我最後不禮貌的叮囑：「阿嬤……，起風的時候，要注意添些衣裳，別在前往極樂世界的路上著涼了。」","「再見的時候，牽起我的手，看暖暖夕陽它越過山丘，世界遼闊，我想陪你一起走，可惜時間它，總是先到盡頭。」這一首歌總是提醒我，要好好珍惜眼前的人事物，雖然我們不能決定生命的長度，但是你可以增添生命的色彩、樂趣，今天想和誰一起到處遊山玩水，一起去尋找幸福，抓住了機會，就去珍惜他。阿嬤對我來講是我生命中佔有份量的角色，但她還是會有離去的一天，如果我能正面思考，就應該想著如何在阿嬤活著的時候，帶給她快樂，不讓她擔心。在阿嬤過世後，有時在路上看到別人的阿嬤，我就會想起曾經也有一位這麼疼我、愛我的人，只是祂現在不住台南那個老家了，而是跟著阿公到處說走就走的旅行。有次母親節的時候，我在中鋼福利社訂了兩個母親節花束，店員有問我這是要送給誰呢？我回答：媽媽跟阿嬤。其實有一個是要拿回家祭拜阿嬤的，雖然我知道以後再也聽不到阿嬤的聲音，但我仍相信阿嬤會在身邊保護著我。這輩子能當祢的孫子是我的驕傲，我也希望阿嬤在另一個世界依然健康、快樂。","在台南奇美醫院與阿嬤牽手"],"images":[{"src":"assets/oct_00_image1.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-文稿-3-3","year":2026,"month":10,"group":3,"category":"文稿","categoryNo":3,"title":"初訪太麻里福興宮遊記","paragraphs":["九月初參加老婆公司的員工旅遊，說是員工旅遊，但實際上是沒有行程的自由行，公司代訂好了飯店，準時入住即可，不過這樣也有好處，不必趕時間，不必人擠人，按照自己的步調，走走逛逛，停停看看，倒也悠閒許多。因為八月底高雄下了將近兩個禮拜的雨，人都快發霉了，好不容易盼到天氣放晴，心情也好很多，不過一路上，偶爾還是有些烏雲飄過，祈禱不要下雨就好。這次來台東知本住宿，上網看了附近的介紹，發現最近很多來台東的遊客，都會來這裡拍照打卡，於是也安排了路線，準備來解鎖這個特別的景點。跟著導航，抵達台東太麻里這個小鎮後，在人不多的巷弄間，慢慢的開往目的地，突然，在某個路口轉彎後，眼前出現了觀光客的人潮與車潮，我想，應該是到了，於是，在附近找好車位停好車之後，再步行前往。","壹、「招財貓」","一抵達現場，最先映入眼簾的便是極具衝擊力的畫面：一座古色古香、雕樑畫棟的傳統土地公廟後方，竟然探出一隻巨大的白色招財貓！這隻招財貓豎著紅色的耳朵，露出一雙圓滾滾的大眼睛，左手高舉著招福，在藍天白雲與綠意環繞的山腳下，呈現出一種傳統信仰與現代可愛文化交融的奇妙趣味。踏入廟埕，空氣中瀰漫著淡淡香火氣息。福興宮主要奉祀福德正神（土地公），廟宇建築雖不大，但燕尾脊上的彩繪與雕刻相當精細。走到廟後探個究竟，才知道這隻巨大的招財貓其實是周邊園區的造景，因為特殊的擺設角度，從正面看過去就像是招財貓正躲在土地公廟後方「偷偷看著你」，意外成為近年網路熱門的打卡秘境。在香爐前合掌參拜，祈求旅途平安。坐在廟前的木椅上休息，微風吹過，旁邊樹上偶爾傳來幾聲蟲鳴鳥叫，心境頓時沉靜下來。這間歷史悠久的土地公廟，也是太麻里當地的信仰中心，歷史可追溯至日治時期來到此地開墾的先民，（最早於 1928 年創建），主要是為了守護當地居民安居樂業，祈求風調雨順農作物豐收。福興宮不僅保留了傳統農村對土地神明的虔誠信仰，有了這隻可愛招財貓的加入，更為靜謐的小村落注入了活潑有趣的生機。","貳、「轉經輪」與「大紅燈籠」","除了後方搶眼的巨型招財貓之外，台東太麻里福興宮（三和福興宮）近年經過巧思改造，融入了許多充滿禪意與日式風情的視覺元素，其中最著名的莫過於廟側的轉經輪廊道與大紅色燈籠。","1. 藏傳信仰「轉經輪」","在傳統的漢人土地公廟中，轉經輪是極為罕見的配置，廟方在走廊設置了一整排黃銅色的轉經輪（祈福轉經筒），形成了轉經輪廊道。轉經輪外表刻有六字大明咒（嗡嘛呢叭咪吽），順時針旋轉一圈，在藏傳佛教傳統中象徵著誦讀了一次經文。信眾與遊客來到這裡，除了持香向土地公祈求平安，也可以沿著廊道一步一步地順時針撥動轉經輪。伴隨著金屬轉動時發出的沉穩微響，能讓人浮躁的心情迅速平靜下來，營造出一種跨越宗派，身心皆受洗禮的祥和氛圍。","2. 日式「大紅燈籠」","台東太麻里福興宮的巨型大紅燈籠裝置，被譽為「台版東京淺草雷門」，是太麻里近年相當知名的打卡景點，也是這個景點的一大亮點與特色。在福興宮牌樓下方懸掛了一座巨大紅燈籠，正面寫著醒目的「太麻里」三個大字，另一面則寫著「台東」兩個大字，遠看宛如日本東京淺草寺的雷門燈籠，兼具台式廟宇風格與日式禪意。當陽光穿過燈籠間隙灑下，或是傍晚華燈初上時分，紅通通的光芒，點亮了靜謐的山腳村落，呈現出宛如日本神社般的浪漫風貌，整個畫面，在視覺上就是一大享受。","叁、「手水舍文化」與「御守儀式感」","太麻里福興宮將日本神社的「手水舍文化」與「御守儀式感」融入台灣在地廟宇，打造出別具特色的參拜體驗。","1. 手水舍（御手洗）","福興宮設有仿造日式神社的手水舍（御手洗），提供石造水槽、竹製水流與木柄勺，供信眾在參拜前洗手、漱口以示對神明的敬意。","2. 特色「水占卜」","廟方推出了極具趣味性的「水占卜籤詩」。信眾求得籤詩時，紙張上原本是空白的；當將籤詩輕輕放入手水舍的水池中，文字與吉凶解籤才會慢慢顯影呈現，儀式感十足。","3. 洗錢池（錢母過水）","手水舍旁亦設有洗錢的小池子，信眾可將自己的硬幣或台幣放入網勺中經水洗滌，祈求土地公賜予「財源滾滾、滾滾而來」的財水發財金。","4. 結合招財貓元素的「特色御守」","​傳統廟宇多發放紙質香火袋或紅布香包，而福興宮則推出了設計極具質感的日系織布御守。","萌系招財貓圖騰：御守將宮廟標誌性的「後山招財貓」形象繪製於布面上，搭配日式刺繡與結繩，色彩繽紛活潑。","​多元祈福功能：包含「招財納福」、「行車平安」、「學業進步」、「健康平安」等不同款式的刺繡御守。","​過爐儀式：購買御守後，同樣可以拿至土地公主爐順時針過爐三圈，兼具日式美感與台灣傳統神明的加持祝福，是遊客造訪時最熱門的紀念品。","一個佔地不算大的土地公廟，竟然能體驗如此多元的文化洗禮，以及欣賞各種有特色的裝置藝術，可以感受到廟方有在用心規劃，也難怪參觀跟參拜的人潮都絡繹不絕。福興宮將藏傳佛教的轉經輪、日式神社風格的燈籠與招財貓，完美地嵌合進台灣傳統的土地公信仰中。各種不設限的包容性，把​傳統信仰與現代美學的融合，讓它從一座原本普通的村落小廟，蛻變成兼具心靈撫慰與拍照美感的新型態宗教景點。如果行經台東太麻里，不妨順道轉進三和村，來福興宮向土地公問好，順便與這隻全台最萌的「廟後招財貓」拍拍照！","​附註：","​拍照取景熱點： 巨大的紅燈籠配合牌樓兩側的石獅子與石柱對聯，構圖非常具有視覺張力， 吸引許多遊客專程前來拍照留念。","拍照小技巧： 站在階梯下方由下往上仰拍，更能凸顯大紅燈籠的巨大氣勢。"],"images":[{"src":"assets/oct_00_image2.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image3.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image4.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image5.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image6.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-文稿-4-4","year":2026,"month":10,"group":1,"category":"文稿","categoryNo":4,"title":"花蓮浪漫之旅","paragraphs":["在觀光署推動的國旅補助方案下，老伴與我「花蓮浪漫之旅」就此拉開序幕。我倆坐在火車上看著窗外遼闊的田園風光，一片片棋盤般整齊劃一的綠色稻田層層遞鋪，讓我們大飽眼福。尤其是花東縱谷，位於中央山脈與海岸山脈之間，長達百餘公里，沿途包括：花蓮與台東的許多知名鄉鎮（如瑞穗、玉里、池上、關山等），整片綠油油的稻田縱橫交錯排列，展現出縱谷平原豐富的農業景緻；另外，田園間散落著各式各樣的平房與特色透天民宅聚落，展現花東地區悠閒寧靜的鄉村生活步調。此外，遠處層疊起伏的雄偉山巒，山頂雲霧繚繞，構成一幅非常恬靜舒心的花東縱谷田園畫卷。隨手一拍都是最經典的東台灣鐵道風景，使我們心情大為舒暢。","在波浪狀屋頂與玻璃帷幕建築的花蓮火車站廣場中央，展示著兩隻具有原住民圖騰特色的紅鴨彩繪公仔裝置藝術（象徵花蓮紅鴨與原鄉文化風格），好像在歡迎我們。之後，騎著腳踏車，漫遊花蓮市區，路邊的美人樹（又稱美人木、絲棉木) 花朵盛開，地上鋪滿落花如粉紅地毯，真是美不勝收。","最後再沿著「花蓮縣兩鐵自行車道導覽圖」所標示的路線，非常安全舒暢地抵達北濱公園。其中園區內設置的極限運動場、沙灘排球場及大型 3D 彩繪等，都是最優良的海濱遊憩區，遊客在此運動或休閒拍照兩相宜。此外，在海灘旁邊，一邊享受著海風輕拂，聆聽浪濤拍岸的聲音，一邊欣賞蔚藍海景及公園的景致，並眺望海灣處的遠山，以及在天空飛翔的海鳥，讓人舒暢與自在。在此，用心地感受太平洋的遼闊與寧靜，令人心胸開闊，就有一股說不出來的喜樂湧上心頭。","下午老伴與我漫遊到花蓮火車站後站出口的富安公園，這裏是運動休閒的綠地。門口的大石球雕塑，由無數塊花蓮特產的大理石與石板堆砌拼貼而成，象徵著花蓮著名的「石頭故鄉」與地質景觀特色；旁邊立著高聳的石牆與柱體，同樣採用了石片拼貼的藝術風格，可說是非常顯眼且極具代表性的大石球與石柱地標藝術創作。","在富安公園內，設置了球場、綠地草坪與運動等設施，是周邊居民與遊客散步休憩的好去處。其中石砌基座上的紅棕色「慈母抱子（母愛）」意象雕像、人物群像與假山池塘造景等，營造出溫馨、祥和且具藝術氣息的綠意空間。此時秋高氣爽，微涼的東北季風，舒適宜人，搭配遠山雲霧，頗有秋日浪漫氛圍，令人陶醉。","這趟老伴與我悠閒與惬意的花蓮之旅，尤其是花東縱谷，沿途這片翠綠隨風起伏的景色，真是讓人百看不厭。此外，東海岸的湛藍海景，總是帶有一種特別撫慰人心的力量，不管是坐在岸邊聆聽浪濤聲，隨意走走，還是什麼都不想地靜靜發呆，都能讓人拋開平日的繁雜，感受到這份難得的寧靜，實在是休閒漫遊的好去處。此時，內心深處的感覺，就如以賽亞書55章12節所述：「山岳岡陵都會在你們面前高興歡呼，田野的樹木都要鼓掌。」最後，我希望能將此趟花蓮浪漫之旅帶入夢鄉，細細品味。","​","花東縱谷美麗的田園風光","花蓮火車站廣場中央展示的兩隻紅鴨彩繪公仔裝置藝術","花蓮市區的美人樹花朵盛開","花蓮縣兩鐵自行車道導覽圖","北濱公園內的極限運動場景觀","北濱公園內的沙灘排球場景觀","北濱公園內的大型 3D 彩繪景觀","北濱公園蔚藍海景","富安公園門口的大石球雕塑與石柱藝術創作","富安公園內「慈母抱子（母愛）」意象雕像"],"images":[{"src":"assets/oct_00_image7.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image8.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image9.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image10.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image11.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image12.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image13.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image14.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image15.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image16.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-文稿-5-5","year":2026,"month":10,"group":2,"category":"文稿","categoryNo":5,"title":"鹽山主題的藍田公園","paragraphs":["近年來，高雄市陸續開發建造十分具有地方特色的公園，全市已有八百多處公園綠地，市府更大手筆大造旗艦版特色公園，楠梓區以鹽山為主題的藍田公園，遊戲與體健設施，全民共享為目的，耗資8600萬元，占地3.45公頃，北高雄社區人口不斷增加，讓市民有一遊樂運動休憩的公園。","藍田公園座落於楠梓區大學與藍田路口，緊臨高雄大學與藍田國小，由於該處曾是下鹽田莊，近年社區不斷興建，人口急速增加，此公園應運而生，改造成高達22項遊樂設施的公園遊戲塲。","北高雄的楠梓區是指標性的繁榮漸進，而藍田生活圈具備交通便利，消費與休閒機能的優勢，藍田公園已成了該區塊最有特色的旗艦版兒童公園，嘉惠高科技電子新貴員工子弟後代歡樂童年，平安長大，更亮眼設施持續引進高科技的優質人才，前途無可限量，指日可待。","藍田公園                                        親子遊樂場"],"images":[{"src":"assets/oct_00_image17.jpeg","caption":"稿件附圖"},{"src":"assets/oct_01_image18.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-文稿-6-6","year":2026,"month":10,"group":3,"category":"文稿","categoryNo":6,"title":"屏東萬丹泥火山","paragraphs":["座落於屏東縣萬丹鄉與新園鄉交界的泥火山，是萬丹鄉和平西路鯉魚山附近，一間廟宇皇源聖殿周遭，泥漿噴出，與斷續火焰，附近田園紅豆栽植，不知何時會噴漿四濺，生死未卜，而成相當奇特景觀，當地農民描述，泥漿或火焰，最高可達兩層樓高，十分的壯觀，相當的恐怖；聰明的農民趕快請來怪手，將田園迅速開挖一條導流，避免噴漿注入田園，保護紅豆等蔬果幼苗，將損害降到最低。","萬丹泥火山的緣由，根據萬丹鄉公所文獻顯示，早在清朝康熙61年(西元1722年)7月11日，鯉魚山附近，發生泥漿噴出，火焰斷續出現，三百多年來，從不間斷噴出，一年好幾次，近年來在每年春節前後，完全沒預兆的上演，噴出的泥漿，就是岩漿和水及天然氣的甲烷，先民認為會有真命天子的出現，早年民智未開，其實不然，哪來的真命天子？泥火山的噴漿，要有四大因素構成：具備有泥岩的地層、而地層要有完備的水源、高壓流體或含有可點燃的甲烷天然氣、地層有裂縫通道等四大因素形成，由於甲烷接觸外界火源或靜電以及自燃驅使，形成熊熊火焰，讓原本冰冷泥漿而成滾熱燙人，長久以來，萬丹鄉住在附近居民早以習以為常，也因此該區塊農田買賣的交割，幾乎是零，由於該處是產業道路，又沒什麼景點可開發為風景區，除了泥火山噴漿場景有好奇遊客外，平日所見，都是當地農民，栽培萬丹十分有名的紅豆耕耘。","依據不同學者調查文獻資料的綜合，目前全臺的泥火山不超過17座，分佈在南部與東部居多，高雄燕巢烏山頂泥火山為全臺規模最大，原貌最完整的噴泥錐景觀，臺南關子嶺水火同源，屏東恆春出水地質公園是火苗而已，但緊密的牡丹鄉，被譽為臺灣版的亞馬遜水上草原，反而喧賓奪主；屏東萬丹泥火山，由於地質環境的使然，位居田園之中，三更半夜或是凌晨破曉時分，泥火山噴漿，擾人清夢的，第一個知道訊息的，往往就是附近皇源聖殿廟宇人員，也因泥火山的噴漿頻傳，提昇不少廟宇的知名度。"],"images":[{"src":"assets/oct_00_image19.jpeg","caption":"稿件附圖"},{"src":"assets/oct_00_image20.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-封底-1-7","year":2026,"month":10,"group":1,"category":"封底","categoryNo":1,"title":"全臺最大駁二特區彩虹地景","paragraphs":["全臺最大高雄市駁二特區彩虹地景，是一個多元平權為主題的戶外鮮豔地標，緊鄰紅色貨櫃藝術造型，總面積是18mX20m，地面是以12條斜紋色塊所組成，並畫上高雄英文舖陳，相當耀眼，我以數位單眼相機，10mm鏡頭拍攝，表現張力，十分悅目。"],"images":[{"src":"assets/oct_00_image21.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-封底-2-8","year":2026,"month":10,"group":2,"category":"封底","categoryNo":2,"title":"大港廻聲","paragraphs":["高雄市駁二特區大港橋旁公共藝術作品，以音樂銅鈴回應高雄蓬萊商港的轉型，取名大港廻聲，榮獲文化部公共藝術創作獎殊榮。","大港廻聲作品是高雄港務公司在2020年耗資5512萬元，整座重逾680公斤搖擺鐘與37顆銅鐘，高達23米深基樁組合而成，50年代香蕉竹簍載運日本意象，大港廻聲讓大家緬懷當年工業重鎮轉型傳承的象徵，事隔整整六年，遲來的肯定，格外的珍惜。"],"images":[{"src":"assets/oct_00_image22.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-封底-3-9","year":2026,"month":10,"group":3,"category":"封底","categoryNo":3,"title":"鏡映南院","paragraphs":["坐落於嘉義的故宮南院，將東方書法的靈魂巧妙融入現代建築。本體化用「濃墨、飛白、渲染」三種筆意，以流線型的姿態交織出剛柔並濟的輪廓。","本照片拍攝於​上午九時的晨光下，微風凝息，無雲的晴空與澄澈的湖面化作一面明鏡。岸上的實體建築與水中的純淨倒影相互凝望，在真實與虛幻之間，勾勒出一幅跨時空的當代水墨，讓人感受清晨的寧靜。"],"images":[{"src":"assets/oct_00_image23.png","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-封底-4-10","year":2026,"month":10,"group":1,"category":"封底","categoryNo":4,"title":"至美橋","paragraphs":["位於嘉義故宮南院中的至美橋，造型宛如一筆充滿力道的草書，在水面劃出巨龍般的流線。為了保護湖底，這座百米大橋捨棄了橋墩，以單拱姿態輕盈跨越。","挺拔的鋼骨與如鏡的湖水相互輝映，水上是真實的「濃墨」，水下是虛幻的「倒影」。此時，夥伴停下腳步、舉起手機拍照，生動的身影就像水墨畫裡一抹不經意暈開的「渲染」。在虛與實的交界處，巧妙為宏偉的鋼鐵橋樑注入了最靈動的人文溫度。"],"images":[{"src":"assets/oct_00_image24.png","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-剪影-1-11","year":2026,"month":10,"group":2,"category":"剪影","categoryNo":1,"title":"紅磚映夜","paragraphs":["橫濱紅磚倉庫曾是港口重要的貨物倉庫，如今已轉型為購物、餐飲與文化活動的熱門景點。夜幕下，暖色燈光映照紅磚外牆，古老建築更添迷人風情。","紅磚映著港都夜色， 暖光沿著歲月流淌； 昔日承載港口繁華， 今夜，成為橫濱最美的篇章。"],"images":[{"src":"assets/oct_00_image25.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-剪影-2-12","year":2026,"month":10,"group":3,"category":"剪影","categoryNo":2,"title":"粉紅清真寺","paragraphs":["馬來西亞布城的粉紅清真寺，以柔美的穹頂與高聳的宣禮塔，勾勒出莊嚴而華麗的建築身影。仰望之間，流動的天光為粉色外牆添上一抹夢幻，也映照出建築深沉而神聖的氣韻。","穹頂上細緻繁複的伊斯蘭紋飾，彷彿將信仰寫成一首無聲的詩。那一刻，眼前不只是異國的建築，更是一幅由信仰、光影與天空共同完成的風景。"],"images":[{"src":"assets/oct_00_image26.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-剪影-3-13","year":2026,"month":10,"group":1,"category":"剪影","categoryNo":3,"title":"朱影深處，願有所歸","paragraphs":["千重朱紅，層層向遠方鋪展，","鳥居相疊，將目光引向祈願的深處。","燈影映著歲月，香火守著心願，","每一步，彷彿都走進一段虔誠的時光。","回首，是漫長的朱色長廊；","向前，是藏在盡頭的神明與祈願。","願走過萬重鳥居之後，","心中所念，終有回響，","所願，終有所歸。"],"images":[{"src":"assets/oct_00_image27.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-剪影-4-14","year":2026,"month":10,"group":2,"category":"剪影","categoryNo":4,"title":"守禮門前的凝望","paragraphs":["蒼穹如洗，洗淨歲月風塵，","蔚藍天幕下，朱紅牌樓兀自莊嚴。","那是首里城的門戶，也是歷史的容顏，","雙層重簷，承載著琉球王國的流光與風華。","佇立門前，仰望那「守禮之邦」的牌匾，","心中湧起一股莫名的感動與敬畏。","那是對傳統的堅守，也是對和平的嚮往，","在這樣的午後，與古老文明進行一場心靈對話。"],"images":[{"src":"assets/oct_00_image28.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-剪影-5-15","year":2026,"month":10,"group":3,"category":"剪影","categoryNo":5,"title":"江南晴空","paragraphs":["高塔刺向晴空，","白雲舒展成一場溫柔的夢。","湖水映著城市的光，森林沿著湖畔鋪展，","而童話般的城堡，靜靜藏在碧色之間。","這一刻的首爾，","有摩天的高度，也有湖水的溫柔，","抬頭是萬里晴空，低頭便是一座閃耀的城市。"],"images":[{"src":"assets/oct_00_image29.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-剪影-6-16","year":2026,"month":10,"group":1,"category":"剪影","categoryNo":6,"title":"神戶港灣暮色","paragraphs":["藍色暮光落入海面，","摩天輪點亮港灣的夜，","一盞盞燈火沿著岸邊延伸，","倒映在波光之間，","城市與海，在神戶的黃昏裡，悄悄相逢。"],"images":[{"src":"assets/oct_00_image30.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-剪影-7-17","year":2026,"month":10,"group":2,"category":"剪影","categoryNo":7,"title":"晴雲為幕，朱門成景","paragraphs":["紅色鳥居映著晴藍，","白雲在天際輕輕舒展；","一步一步走下石階，","風掠過樹梢，陽光落在肩上。","抬頭，是一片澄澈的藍，","低頭，是通往神社的路；","那一刻，彷彿整座天空，","都在眼前與我相遇。"],"images":[{"src":"assets/oct_00_image31.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-剪影-8-18","year":2026,"month":10,"group":3,"category":"剪影","categoryNo":8,"title":"藏王雪行","paragraphs":["踏進藏王的雪國，","白雪覆滿山林，枝椏披上一層銀霜。","一列鮮紅的列車停在雪地之間，","像冬日裡燃起的一抹暖色，","而我站在漫天雪光裡，","親眼遇見了山形最浪漫的冬天。"],"images":[{"src":"assets/oct_00_image32.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-剪影-9-19","year":2026,"month":10,"group":1,"category":"剪影","categoryNo":9,"title":"凝眸","paragraphs":["琥珀色的眼，","藏著夜的深邃，","橘色身影融進微光之間。","一眼回望，","像是與人交換了一場無聲的溫柔。"],"images":[{"src":"assets/oct_00_image33.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-剪影-10-20","year":2026,"month":10,"group":2,"category":"剪影","categoryNo":10,"title":"日本福島第一只見川橋梁","paragraphs":["冬天把山巒染成一片寂靜，","只見川沿著谷底緩緩流過，","鐵橋橫在雪色與蕭瑟之間，","沒有列車經過，只有風穿過橋身，留下細微的聲響。","我站在遠處等待，目光一次次投向鐵道的盡頭，","期待列車從山林深處緩緩出現，","為沉默的冬日添上一抹流動的色彩。"],"images":[{"src":"assets/oct_00_image34.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-剪影-11-21","year":2026,"month":10,"group":3,"category":"剪影","categoryNo":11,"title":"釣魚","paragraphs":["水面尚平，","像一頁還沒寫完的稿紙。","我把線拋出去，","不是為了抓住什麼，","只是讓等待有個方向。","浮標輕輕晃動，","像心裡那些微小的念頭，時有時無。","風慢慢吹過，時間也變慢，","帶走急促，也帶走聲音。","魚有沒有來過，誰也不知道。","遊蕩在我們之間的，只剩寧靜。"],"images":[{"src":"assets/oct_00_image35.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-剪影-12-22","year":2026,"month":10,"group":1,"category":"剪影","categoryNo":12,"title":"塔映東京","paragraphs":["夜色落在東京的天際，","鐵塔亮起溫暖的燈光。","眼前橋影緩緩延伸，車流穿梭其間，","抬頭是塔，低頭是光，","而我站在這座城市的夜裡，","看見東京最動人的一刻。"],"images":[{"src":"assets/oct_00_image36.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-剪影-13-23","year":2026,"month":10,"group":2,"category":"剪影","categoryNo":13,"title":"懸崖邊的樓梯","paragraphs":["西洞尾燈塔位於望安島的西北角，早期居民在西洞尾海岬上建造的一座燈塔，目前已不再使用，天氣晴朗時可360度遠眺海面、礁岩與漁港景色，成為探訪秘境旅人的私房景點。"],"images":[{"src":"assets/oct_00_image37.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-剪影-14-24","year":2026,"month":10,"group":3,"category":"剪影","categoryNo":14,"title":"網垵口沙灘","paragraphs":["網垵口沙灘位於望安島南端貝殼砂灘潔淨而無汙染，擁有細白的沙質、清澈的海水，一公里長的沙灘與湛藍的天際及海水相映成畫。5~10月夜間完全禁止進入沙灘，且嚴禁使用手電筒照射沙面，以免驚擾產卵的綠蠵龜。"],"images":[{"src":"assets/oct_00_image38.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-剪影-15-25","year":2026,"month":10,"group":1,"category":"剪影","categoryNo":15,"title":"綠蠵龜涼亭","paragraphs":["澎湖望安是台灣重要的綠蠵龜產卵棲地之一，故在土地公漁港旁設有一座高約4公尺、長約8公尺的巨大綠蠵龜造型涼亭，結合了遮蔭功能與休憩石椅，象徵「望而心安」。"],"images":[{"src":"assets/oct_00_image39.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-剪影-16-26","year":2026,"month":10,"group":2,"category":"剪影","categoryNo":16,"title":"望安第一高峰","paragraphs":["澎湖望安島的「天台山」是島上地勢最高的地方，海拔53公尺，位置得天獨厚，登上山頂可遠眺花嶼、小貓嶼與台灣海峽，山頂有一塊風化侵蝕的玄武岩，表面形成貌似巨人腳印的凹洞，相傳是仙人呂洞賓在此留下足跡。"],"images":[{"src":"assets/oct_00_image40.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-剪影-17-27","year":2026,"month":10,"group":3,"category":"剪影","categoryNo":17,"title":"哈密瓜車站","paragraphs":["澎湖白沙鄉後寮村是澎湖重要的瓜果產地，為推廣在地特色，打造結合哈蜜瓜、洋香瓜造型的候車亭，提供遊憩、拍照、遮陽、避雨之候車環境。"],"images":[{"src":"assets/oct_00_image41.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-剪影-18-28","year":2026,"month":10,"group":1,"category":"剪影","categoryNo":18,"title":"小臺灣","paragraphs":["澎湖縣七美嶼知名景點，玄武岩平台因長年受到海浪侵蝕，勾勒出宛如臺灣本島輪廓的形狀。對旅人而言，站在離島遠望這塊「縮小版臺灣」，彷彿象徵著離島與本島之間的情感連結。"],"images":[{"src":"assets/oct_00_image42.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-剪影-19-29","year":2026,"month":10,"group":2,"category":"剪影","categoryNo":19,"title":"福爾摩沙","paragraphs":["無邊際的天，深不可測的海， 我好似孤島坐落在世界的一角，藍天白雲相擁，海風環環圍繞，島上滿腔的熱情，讓我擁有無限勇氣，面對每一個挑戰。"],"images":[{"src":"assets/oct_00_image43.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-剪影-20-30","year":2026,"month":10,"group":3,"category":"剪影","categoryNo":20,"title":"樹根奇景","paragraphs":["高雄市蓮池潭附近有棵老榕樹，樹根盤根雜生，包覆在水泥水岸底下與水共存，形成相當奇特的樹根景觀，被國外遊客上網而吸腈，引來250萬人瀏覽，一夕爆紅，由於該處正是人行道拓寬工程的位置，樹根保護與否的論戰，官員與護樹民間團體、專家、學者、民意代表的意見紛紛，最後達成不拓寬人行道，保留樹根景觀的共識。"],"images":[{"src":"assets/oct_00_image44.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-剪影-21-31","year":2026,"month":10,"group":1,"category":"剪影","categoryNo":21,"title":"高雄熱氣球","paragraphs":["英國泰晤士報評鑑高雄為國際最適合秋季旅遊城市選項，民國115年雙十國慶連假，高雄市政府將熱氣球在田寮月世界活動兩週，造次八萬多人轟動場面，移師高雄愛河，兩顆熱氣球與高雄熊及遊艇，夕陽西下，海天一色，十分美麗，萬分吸睛，讓遊客流連忘返。"],"images":[{"src":"assets/oct_00_image45.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-剪影-22-32","year":2026,"month":10,"group":2,"category":"剪影","categoryNo":22,"title":"雪映古村","paragraphs":["白雪覆上合掌屋頂，層層山巒隱入冬日雲煙。屋前池水映著蒼茫天色，枝影與雪景交織成一幅靜美的畫卷。當我駐足於此，彷彿走進歲月珍藏的故鄉，聽見寒冬無聲，感受古村在風雪之中，依然溫柔而堅定地守候著時光。"],"images":[{"src":"assets/oct_00_image46.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-剪影-23-33","year":2026,"month":10,"group":3,"category":"剪影","categoryNo":23,"title":"穗花棋盤腳","paragraphs":["穗花棋盤腳（又稱為水茄苳），學名為 Barringtonia racemosa。喜歡生長在水邊或濕地環境的景觀樹種，是台灣相當珍貴且具特色的原生親水性植物。","清晨在衛武營公園湖畔，捕捉到剛好還掛在枝頭上的花朵，宛如稻穗般一串串懸垂的花序，長長的花梗垂掛而下，上面帶有許多花苞與剛綻開的粉紅色花朵，擁有細緻絲狀的花絲，葉片濃綠光亮，實在非常優美，令人心曠神怡。","​"],"images":[{"src":"assets/oct_00_image47.jpeg","caption":"稿件附圖"},{"src":"assets/oct_01_image48.jpeg","caption":"稿件附圖"},{"src":"assets/oct_02_image49.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-剪影-24-34","year":2026,"month":10,"group":1,"category":"剪影","categoryNo":24,"title":"海天一線","paragraphs":["橫濱的海，將一整片湛藍鋪展至天際，白色的港灣大橋，如一行寫在海上的詩，承接著遠方，也牽引著目光。","浪花在腳邊低語，雲朵在天空盛放，海風越過橋身，彷彿把城市的故事，輕輕送往看不見的彼岸。"],"images":[{"src":"assets/oct_00_image50.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-詩詞-1-35","year":2026,"month":10,"group":2,"category":"詩詞","categoryNo":1,"title":"《逆光之翼》","paragraphs":["黑色的羽翼","從鋼鐵與陽光之間","突然醒來。","它不飛——","只是把天空","折成自己的方向。","風經過","留下鋒利的弧線；","光穿過羽尖，","像一場沉默的重生。","不必飛向遠方，","站在光裡，","就是翱翔。"],"images":[{"src":"assets/oct_00_image51.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-詩詞-2-36","year":2026,"month":10,"group":3,"category":"詩詞","categoryNo":2,"title":"《反差》","paragraphs":["一片柔軟的草地，","托著一顆","冰冷的金屬心臟。","天空很安靜，","它卻像一枚","正在爆炸的螺旋。","白，是風。","銀，是刀。","綠，是沉默。","城市向前，","雕塑卻逆著時間——","一邊生長，","一邊腐蝕。","而我們站在中間，","渺小得","像一個","不敢停止的句號。"],"images":[{"src":"assets/oct_00_image52.jpeg","caption":"稿件附圖"},{"src":"assets/oct_01_image53.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-詩詞-3-37","year":2026,"month":10,"group":1,"category":"詩詞","categoryNo":3,"title":"樂園","paragraphs":["在熟悉的回眸中醒來","妳就在眼前 這不是夢","妳活生生出現在我眼角","就在轉角不遠處 我遇到妳 遇到了愛","從去年夏天到今天秋天","我思念著妳","妳的笑容 妳的和藹","我怕腦海中的錄音機","哪一天會忘記妳的聲音","日日夜夜 夜夜日日","妳在我心裡","我們緊緊擁抱","那一刻眼淚傾盆而出","親愛的Rose 我的德國媽媽","妳終於又回到我的身邊","我們再次走到妳在德國栽種的","萊茵玫瑰園","我摘下一朵初夏玫瑰","再次別妳髮上","妳為我別玫瑰於髮之際","我們都哭了","想念太難熬","然而我們終於等到","樂園","永永遠遠","萬世不變"],"images":[{"src":"assets/oct_00_image54.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-詩詞-4-38","year":2026,"month":10,"group":2,"category":"詩詞","categoryNo":4,"title":"隔離","paragraphs":["你的溫柔","寵壞了我","我不可能跟你","只做普通朋友","可是你用道歉推開了我","我只能在窗外看著你","遲遲不飛走","心疼自己淋濕的翅膀","在這名為愛你的雨中","無力解脫","如月光般療癒的你","被調成永晝模式","我開啟與太陽親近的距離","一蝶本身就有兩翅","沒有你的視界","我也能飛行無垠"],"images":[{"src":"assets/oct_00_image55.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-詩詞-5-39","year":2026,"month":10,"group":3,"category":"詩詞","categoryNo":5,"title":"巴多 巴多 巴多 巴多","paragraphs":["那秋季夜裡 蛙鳴傳來陣陣","巴多 巴多 巴多 巴多","我轉眼望向池塘","四隻青蛙呆呆傻傻癡癡靜靜望著我","在剛滿四十歲的那晚 我愣住了","一隻十歲青蛙天真可愛","像一歲小貓懵懂","開心望著世界","第二隻青蛙","似乎有二十歲了","想要跳出池塘","後腿振翅跳躍","想要高飛","第三隻而立青蛙","悠閒著時光","午夜三刻鐘","最後一只蛙","她的巴多像在彈古董鋼琴","律著弦 綠著閒","自在氛圍 芬多精著我","池塘樂音生態池","人生中年女子","感激四隻蛙","嫩綠 淺綠 墨綠 深綠","人生四景 人生四境","巴多 巴多 巴多 巴多"],"images":[{"src":"assets/oct_00_image56.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-親子園地-1-40","year":2026,"month":10,"group":1,"category":"親子園地","categoryNo":1,"title":"左營拱辰門-兵臨城下 (國小二年級)","paragraphs":[],"images":[{"src":"assets/oct_00_image57.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-親子園地-2-41","year":2026,"month":10,"group":2,"category":"親子園地","categoryNo":2,"title":"端午節 (國小一年級)","paragraphs":[],"images":[{"src":"assets/oct_00_image58.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-3-親子園地-3-42","year":2026,"month":10,"group":3,"category":"親子園地","categoryNo":3,"title":"中秋烤肉 (國小一年級)","paragraphs":[],"images":[{"src":"assets/oct_00_image59.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-1-親子園地-4-43","year":2026,"month":10,"group":1,"category":"親子園地","categoryNo":4,"title":"中秋家人烤肉趣 (國小三年級)","paragraphs":[],"images":[{"src":"assets/oct_00_image60.jpeg","caption":"稿件附圖"}],"files":[]},{"id":"2026-10-2-親子園地-5-44","year":2026,"month":10,"group":2,"category":"親子園地","categoryNo":5,"title":"魔幻空間 (國中三年級)","paragraphs":[],"images":[{"src":"assets/oct_00_image61.jpeg","caption":"稿件附圖"}],"files":[]},{"id":" const DBKEY='publicity-month-data-v1', PICKKEY='publicity-selected-v1';
let months=Array.isArray(initial)?initial.slice():[initial];
try{const saved=JSON.parse(localStorage.getItem(DBKEY)||'[]');for(const m of saved)if(m?.year&&m?.month&&!months.some(x=>x.year===m.year&&x.month===m.month))months.push(m)}catch{}
months.sort((a,b)=>a.year-b.year||a.month-b.month);let current=months[months.length-1];
const $=s=>document.querySelector(s),cats=['文稿','剪影','詩詞','親子園地','封底'];
function monthKey(m){return `${m.year}-${String(m.month).padStart(2,'0')}`}
function picked(){try{return JSON.parse(localStorage.getItem(PICKKEY)||'{}')}catch{return {}}}
function savePicked(x){localStorage.setItem(PICKKEY,JSON.stringify(x))}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fillDates(){const ys=[...new Set(months.map(m=>m.year))].sort((a,b)=>b-a);$('#year').innerHTML=ys.map(y=>`<option value="${y}">${y}</option>`).join('');$('#year').value=current.year;fillMonths()}
function fillMonths(){const list=months.filter(m=>m.year==$('#year').value).sort((a,b)=>a.month-b.month);$('#month').innerHTML=list.map(m=>`<option value="${monthKey(m)}">${m.month} 月</option>`).join('');$('#month').value=monthKey(current);current=list.find(m=>monthKey(m)===$('#month').value)||list[0];render()}
function baseEntries(){return current.entries||[]}
function filtered(){const g=$('#group').value,c=$('#category').value,q=$('#search').value.trim().toLocaleLowerCase();return baseEntries().filter(e=>(g==='all'||e.group==g)&&(c==='all'||e.category===c)&&(!q||(`${e.title} ${(e.paragraphs||[]).join(' ')}`).toLocaleLowerCase().includes(q)))}
function updateCategories(){const old=$('#category').value,g=$('#group').value;const available=cats.filter(c=>baseEntries().some(e=>(g==='all'||e.group==g)&&e.category===c));$('#category').innerHTML='<option value="all">全部類別</option>'+available.map(c=>`<option value="${safe(c)}">${safe(c)}</option>`).join('');$('#category').value=available.includes(old)?old:'all'}
function render(){updateCategories();const items=filtered(),sel=picked(),key=monthKey(current);$('#count').textContent=`${current.label||key} · 顯示 ${items.length}/${baseEntries().length} 篇`;
$('#jumpCount').textContent=items.length;$('#articleCount').textContent=`${items.length} 篇稿件`;
$('#jumps').innerHTML=items.map(e=>`<a href="#${safe(e.id)}">第${e.group}組 · ${safe(e.category)}${e.categoryNo}｜${safe(e.title)}</a>`).join('');
$('#jumpEmpty').hidden=items.length>0;$('#articles').innerHTML=items.length?items.map(e=>{const id=key+'|'+e.id;return `<article class="article" id="${safe(e.id)}"><div class="article-top"><input type="checkbox" aria-label="勾選入選：${safe(e.title)}" data-pick="${safe(id)}" ${sel[id]?'checked':''}><div><div class="meta">${safe(current.label||key)} · 第${e.group}組 · ${safe(e.category)}${e.categoryNo}</div><h2>第${e.group}組 · ${safe(e.category)}${e.categoryNo}｜${safe(e.title)}</h2></div></div>${(e.paragraphs||[]).map(p=>`<p>${safe(p)}</p>`).join('')}${e.images?.length?`<div class="photos">${e.images.map(i=>`<figure><img loading="lazy" src="${safe(i.src)}" alt="${safe(i.caption||e.title)}"><figcaption>${safe(i.caption||'稿件附圖')}</figcaption></figure>`).join('')}</div>`:''}${e.files?.map(f=>`<p><a href="${safe(f)}" target="_blank" rel="noopener">開啟附件 PDF</a></p>`).join('')}</article>`}).join(''):'<div class="empty">目前條件沒有符合的稿件。調整組別、類別或搜尋關鍵字再試一次。</div>';renderCollection()}
function renderCollection(){const sel=picked(),entries=[];for(const [k,v] of Object.entries(sel)){if(!v)continue;const [mk,id]=k.split('|'),m=months.find(x=>monthKey(x)===mk),e=m?.entries?.find(x=>x.id===id);if(e)entries.push({m,e})}$('#selectedCount').textContent=entries.length;$('#selectedBadge').textContent=entries.length;$('#export').disabled=!entries.length;$('#clear').disabled=!entries.some(x=>monthKey(x.m)===monthKey(current));$('#selectedList').innerHTML=entries.length?'<ol class="selection-list">'+entries.map(x=>`<li>${safe(x.m.label||monthKey(x.m))} · 第${x.e.group}組 ${safe(x.e.category)}${x.e.categoryNo}｜${safe(x.e.title)}</li>`).join('')+'</ol>':'<p class="selection-empty">尚未勾選作品。可在文章標題旁勾選加入。</p>'}
function exportWord(){const sel=picked(),arr=[];for(const [k,v] of Object.entries(sel)){if(!v)continue;const [mk,id]=k.split('|'),m=months.find(x=>monthKey(x)===mk),e=m?.entries?.find(x=>x.id===id);if(e)arr.push({m,e})}if(!arr.length)return;const esc=s=>safe(s).replace(/\n/g,'<br>');const html=`<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:PMingLiU,"Microsoft JhengHei",sans-serif;line-height:1.8}h1{text-align:center}h2{page-break-before:always;color:#234b3c}h2:first-of-type{page-break-before:auto}.meta{color:#555;font-size:10pt}p{white-space:pre-wrap}img{max-width:100%;max-height:600px}</style></head><body><h1>入選作品集</h1><p>共 ${arr.length} 篇</p>`+arr.map(({m,e})=>`<h2>第${e.group}組 · ${esc(e.category)}${e.categoryNo}｜${esc(e.title)}</h2><p class="meta">${esc(m.label||monthKey(m))}</p>`+(e.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')+(e.images||[]).map(i=>`<p><img src="${esc(new URL(i.src,location.href).href)}" alt="${esc(i.caption||e.title)}"></p>`).join('')).join('')+'</body></html>';const blob=new Blob(['\ufeff',html],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='入選作品集.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function closePanels(){for(const [btn,panel] of [['#filterJumpToggle','#filterJumpPanel'],['#collectionToggle','#collectionPanel']]){$(btn).setAttribute('aria-expanded','false');$(panel).hidden=true}}
function togglePanel(button,panel){const opening=$(button).getAttribute('aria-expanded')!=='true';closePanels();if(opening){$(button).setAttribute('aria-expanded','true');$(panel).hidden=false}}
$('#filterJumpToggle').onclick=()=>togglePanel('#filterJumpToggle','#filterJumpPanel');$('#collectionToggle').onclick=()=>togglePanel('#collectionToggle','#collectionPanel');
$('#group').onchange=render;$('#category').onchange=render;$('#search').oninput=render;
$('#year').onchange=()=>{const list=months.filter(m=>m.year==$('#year').value).sort((a,b)=>a.month-b.month);if(list.length)current=list[0];fillMonths()};$('#month').onchange=()=>{current=months.find(m=>monthKey(m)===$('#month').value)||current;render()};
$('#articles').onchange=e=>{const t=e.target.closest('[data-pick]');if(!t)return;const x=picked();x[t.dataset.pick]=t.checked;savePicked(x);renderCollection()};$('#export').onclick=exportWord;
$('#clear').onclick=()=>{const x=picked();for(const k of Object.keys(x))if(k.startsWith(monthKey(current)+'|'))delete x[k];savePicked(x);render();};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const m=JSON.parse(await e.target.files[0].text());if(!m.year||!m.month||!Array.isArray(m.entries))throw Error('資料格式不符');const i=months.findIndex(x=>monthKey(x)===monthKey(m));if(i>=0)months[i]=m;else months.push(m);const extras=months.filter(x=>!initial.some(y=>monthKey(y)===monthKey(x)));localStorage.setItem(DBKEY,JSON.stringify(extras));months.sort((a,b)=>a.year-b.year||a.month-b.month);current=m;fillDates();$('#month').value=monthKey(m);alert('月份資料已加入此瀏覽器。請確認該月份的圖片資產路徑也可讀取。')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};
$('#jumps').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const target=document.getElementById(decodeURIComponent(a.hash.slice(1)));if(!target)return;e.preventDefault();closePanels();history.replaceState(null,'',a.hash);requestAnimationFrame(()=>{const offset=$('#stickyTools').getBoundingClientRect().height+12;const y=target.getBoundingClientRect().top+window.pageYOffset-offset;window.scrollTo({top:Math.max(0,y),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})})});
document.addEventListener('click',e=>{if(!e.target.closest('#stickyTools'))closePanels()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});fillDates();
</script>
</body></html>
