<style>
:root{color-scheme:light;--ink:#21342e;--forest:#183e35;--forest-2:#2d5a4b;--paper:#edf2ec;--surface:#fffefa;--line:#d9ddd4;--muted:#596c63;--accent:#537862;--focus:#b96f3a;--shadow:0 8px 18px rgba(24,62,53,.12);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:var(--paper);font-size:16px;line-height:1.7}button,input,select,textarea{font:inherit;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.page{max-width:1180px;margin:auto;padding:22px 22px 72px}.hero{padding:24px 0 20px}.hero h1{font-size:34px;line-height:1.2;letter-spacing:-.02em;margin:0;font-weight:750;color:var(--forest)}.hero p{max-width:68ch;color:var(--muted);margin:8px 0 12px}.public-note{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid #c8d3c7;border-radius:7px;background:#e9eee7;color:#334f41;font-size:12px}.sticky{position:sticky;top:0;z-index:20;background:rgba(237,242,236,.97);border-top:1px solid rgba(217,221,212,.9);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(35,57,47,.07);backdrop-filter:blur(12px);margin:0 -22px;padding:10px 22px}.barline{max-width:1136px;margin:auto;display:flex;align-items:center;gap:14px;min-height:42px}.brand{font-size:14px;font-weight:750;letter-spacing:.02em;color:var(--forest);white-space:nowrap}.dates{display:flex;gap:6px;align-items:center}.dates select{min-height:38px;padding:6px 30px 6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:14px}.status{font-size:13px;color:var(--muted);white-space:nowrap;margin-right:auto}.actions{display:flex;gap:7px;align-items:center}.action{min-height:38px;padding:7px 11px;border:1px solid #bdc9bd;border-radius:7px;background:var(--surface);font-size:13px;font-weight:650;cursor:pointer;transition:background .16s ease,border-color .16s ease,color .16s ease}.action:hover{background:#e9eee7;border-color:#829b87}.action[aria-expanded="true"]{background:var(--forest);border-color:var(--forest);color:#fff}.action.primary{background:var(--forest);color:#fff;border-color:var(--forest)}.action.primary:hover{background:#2a5b4a}.badge{display:inline-block;min-width:1.4em;margin-left:3px;padding:0 5px;border-radius:999px;background:#e4e9e0;color:#294b3e;font-variant-numeric:tabular-nums}.action[aria-expanded="true"] .badge,.action.primary .badge{background:#ffffff2b;color:#fff}.panel-anchor{position:relative;max-width:1136px;margin:auto}.dropdown{position:relative;top:auto;right:auto;width:min(760px,100%);max-height:min(66vh,590px);margin:10px auto 0;overflow:auto;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30}.dropdown[hidden]{display:none!important}.browse-panel{width:min(1080px,100%)}.browse-columns{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.2fr);gap:22px;align-items:start}.browse-filter{min-width:0}.browse-jumps{min-width:0}.jump-empty{margin-top:12px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;font-size:16px;font-weight:750;color:var(--forest)}.panel-hint{font-size:12px;color:var(--muted);font-weight:400}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;margin-bottom:4px;color:var(--muted);font-size:12px}.field select,.field input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px 10px}.field.search{grid-column:1/-1}.jump-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}.jump-list a{display:block;padding:7px 8px;border-radius:6px;color:#294d3e;text-decoration:none;font-size:13px;line-height:1.45}.jump-list a:hover{background:#edf1ea;text-decoration:underline;text-underline-offset:3px}.jump-list a[hidden]{display:none!important}.selection-list{max-height:38vh;overflow:auto;margin:0 0 12px;padding-left:22px}.selection-list li{margin:5px 0;padding-left:2px}.review-list{max-height:48vh;overflow:auto;margin:0 0 12px;padding:0;list-style:none}.review-item{padding:12px 0;border-bottom:1px solid var(--line)}.review-item:last-child{border-bottom:0}.review-entry-title{margin:0 0 8px;color:var(--forest);font-weight:650;line-height:1.5}.review-opinion{margin:4px 0 0;color:var(--muted);font-size:13px;white-space:pre-wrap}.review-fields{display:grid;grid-template-columns:minmax(140px,180px) minmax(0,1fr);gap:10px}.review-field label{display:block;margin:0 0 4px;color:var(--muted);font-size:12px}.review-field select,.review-field textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px 10px}.review-field textarea{min-height:68px;resize:vertical}.selection-empty{color:var(--muted);font-size:14px;margin:6px 0 14px}.panel-actions{display:flex;gap:8px;flex-wrap:wrap}.button{min-height:38px;padding:8px 12px;border-radius:7px;border:1px solid var(--forest-2);background:var(--forest-2);color:white;font-weight:650;font-size:13px;cursor:pointer}.button:hover{background:var(--forest)}.button.secondary{background:transparent;color:var(--forest)}.button.secondary:hover{background:#edf1ea}.button:disabled{opacity:.5;cursor:not-allowed}.fineprint{font-size:12px;color:var(--muted);margin:10px 0 0}.article-count{margin:18px 0 12px;color:var(--muted);font-size:13px}.article{max-width:860px;margin:0 auto 18px;padding:26px 30px;background:var(--surface);border:1px solid #e4e3db;border-radius:12px;scroll-margin-top:92px;box-shadow:0 3px 14px rgba(36,54,44,.045)}.article-top{display:grid;grid-template-columns:1fr;gap:12px}.article-review-inline{display:block}.article-review-inline textarea{min-height:40px;max-height:160px;resize:vertical}.article-review-inline textarea:focus{min-height:84px}.article-heading{min-width:0}.meta{font-size:12px;letter-spacing:.02em;color:var(--muted)}.article h2{font-size:21px;line-height:1.45;letter-spacing:-.01em;color:var(--forest);margin:3px 0 5px}.article p{max-width:72ch;margin:14px auto;white-space:pre-wrap;line-height:1.9;text-wrap:pretty}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:20px 0 2px}.photos figure{margin:0;min-width:0}.photos img{display:block;width:100%;height:auto;max-height:430px;object-fit:contain;background:#f1f0e9;border-radius:7px}.photos figcaption{margin-top:5px;color:var(--muted);font-size:12px}.article a{color:#315d49;text-underline-offset:3px}.empty{max-width:860px;margin:20px auto;padding:40px 24px;text-align:center;background:var(--surface);border:1px dashed #b9c6b9;border-radius:10px;color:var(--muted)}footer{max-width:860px;margin:28px auto 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}::selection{background:#cbdcc9;color:#152f26}input::placeholder{color:#596c63;opacity:1}button,select{accent-color:var(--forest)}
@media(max-width:850px){.page{padding-left:16px;padding-right:16px}.sticky{margin:0 -16px;padding:9px 16px}.barline{flex-wrap:wrap;gap:8px}.brand{margin-right:auto}.status{order:3;width:100%;margin:0}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{gap:5px}.action{padding:6px 9px}.article{padding:22px 24px}}
@media(max-width:560px){body{font-size:15px}.page{padding:14px 12px 52px}.hero{padding:14px 2px 13px}.hero h1{font-size:29px}.hero p{font-size:14px;margin:6px 0 9px}.public-note{font-size:12px}.sticky{margin:0 -12px;padding:8px 12px}.barline{display:grid;grid-template-columns:auto 1fr;gap:8px}.brand{font-size:13px}.dates{justify-content:end}.dates select{min-height:35px;padding:5px 22px 5px 7px;font-size:12px}.actions{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.action{min-height:36px;padding:6px 5px;font-size:12px}.status{grid-column:1/-1;order:4;font-size:12px}.dropdown{right:auto;top:auto;padding:13px;width:100%;margin-top:7px;max-height:65vh}.browse-columns{grid-template-columns:1fr;gap:18px}.browse-jumps{border-top:1px solid var(--line);padding-top:14px}.filters{grid-template-columns:1fr 1fr;gap:8px}.field.search{grid-column:1/-1}.jump-list{grid-template-columns:1fr;gap:1px}.jump-list a{padding:8px 7px}.article{padding:18px 16px;margin-bottom:12px;border-radius:9px;scroll-margin-top:120px}.article h2{font-size:19px}.article p{line-height:1.85;margin:13px 0}.photos{grid-template-columns:1fr;gap:10px}.photos img{max-height:400px}.article-top{gap:10px}.article-count{margin-top:14px}}
@media(max-width:560px){.review-fields{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="page">
<header class="hero"><h1>文宣作品集</h1><p>依年月整理稿件，按組別與文稿類別同步篩選；勾選作品即可建立入選集。</p><div class="public-note">公開頁面｜任何取得網址的人都可瀏覽與下載稿件及附圖</div></header>
<header class="sticky" id="stickyTools" aria-label="固定工具列">
  <div class="barline">
    <div class="brand">文宣稿件</div>
    <div class="dates"><label class="sr-only" for="year">年份</label><select id="year" aria-label="選擇年份"></select><label class="sr-only" for="month">月份</label><select id="month" aria-label="選擇月份"></select></div>
    <div class="status" id="count" aria-live="polite"></div>
    <div class="actions" id="browseActions"><button class="action" id="filterJumpToggle" aria-expanded="false" aria-controls="filterJumpPanel">篩選與快速跳轉 <span class="badge" id="jumpCount">0</span></button><button class="action" id="collectionToggle" aria-expanded="false" aria-controls="collectionPanel">入選 <span class="badge" id="selectedBadge">0</span></button></div>
  </div>
  <div class="panel-anchor">
    <section class="dropdown browse-panel" id="filterJumpPanel" hidden aria-label="篩選與快速跳轉"><div class="browse-columns" id="browseColumns"><div id="filterPanel" class="browse-filter" aria-label="稿件篩選"><h2 class="panel-title">篩選稿件 <span class="panel-hint">組別與類別條件會同步套用</span></h2><div class="filters"><div class="field"><label for="group">組別</label><select id="group"><option value="all">全部組別</option><option value="1">第 1 組</option><option value="2">第 2 組</option><option value="3">第 3 組</option></select></div><div class="field"><label for="category">文稿類別</label><select id="category"><option value="all">全部類別</option></select></div><div class="field search"><label for="search">搜尋標題與內文</label><input id="search" type="search" placeholder="輸入關鍵字"></div></div></div>
    <div id="jumpPanel" class="browse-jumps" aria-label="快速跳轉"><h2 class="panel-title">文章快速跳轉 <span class="panel-hint">只列出目前篩選結果</span></h2><nav id="jumps" class="jump-list"></nav><p class="selection-empty jump-empty" id="jumpEmpty" hidden>目前篩選沒有符合的稿件可跳轉。</p></div></div></section>
    <section class="dropdown" id="collectionPanel" hidden aria-label="入選作品集"><h2 class="panel-title">入選作品集 <span class="panel-hint"><span id="selectedCount">0</span> 篇</span></h2><div id="selectedList"></div><div class="panel-actions"><button id="export" class="button" disabled>匯出 Word（.docx）</button><button id="clear" class="button secondary" disabled>清除此月份入選標記</button><button id="importBtn" class="button secondary">匯入月份 JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p class="fineprint">審查狀態、意見及匯入資料只保存在目前瀏覽器，不會自動同步至其他裝置。匯出 Word 請使用公開網站網址，以便將附圖嵌入文件。</p></section>
  </div>
</header>
<div id="articleCount" class="article-count"></div><section id="articles" aria-live="polite"></section>
<footer>文章以月份分開，勾選作品可跨月份彙整。每月稿件如有新增，可更新此網站的月份資料；原始 pCloud 檔案不會因網站操作而變動。</footer>
</main>
<script>
__DOCX_EXPORT__
const initial=__DATA__;
const DBKEY='publicity-month-data-v1', PICKKEY='publicity-selected-v1', REVIEWKEY='publicity-review-v1';
let months=Array.isArray(initial)?initial.slice():[initial];
try{const saved=JSON.parse(localStorage.getItem(DBKEY)||'[]');for(const m of saved)if(m?.year&&m?.month&&!months.some(x=>x.year===m.year&&x.month===m.month))months.push(m)}catch{}
months.sort((a,b)=>a.year-b.year||a.month-b.month);let current=months[months.length-1];
const $=s=>document.querySelector(s),cats=['文稿','剪影','詩詞','親子園地','封底'];
function monthKey(m){return `${m.year}-${String(m.month).padStart(2,'0')}`}
function picked(){try{return JSON.parse(localStorage.getItem(PICKKEY)||'{}')}catch{return {}}}
function savePicked(x){localStorage.setItem(PICKKEY,JSON.stringify(x))}
function reviews(){try{return JSON.parse(localStorage.getItem(REVIEWKEY)||'{}')}catch{return {}}}
function saveReviews(x){localStorage.setItem(REVIEWKEY,JSON.stringify(x))}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function migrateLegacyPicks(){const old=picked(),all=reviews();for(const [k,v] of Object.entries(old))if(v&&(!all[k]||all[k].status==='pending'))all[k]={...all[k],status:'selected',note:all[k]?.note||''};if(Object.keys(old).length){saveReviews(all);localStorage.removeItem(PICKKEY)}}
function fillDates(){const ys=[...new Set(months.map(m=>m.year))].sort((a,b)=>b-a);$('#year').innerHTML=ys.map(y=>`<option value="${y}">${y}</option>`).join('');$('#year').value=current.year;fillMonths()}
function fillMonths(){const list=months.filter(m=>m.year==$('#year').value).sort((a,b)=>a.month-b.month);$('#month').innerHTML=list.map(m=>`<option value="${monthKey(m)}">${m.month} 月</option>`).join('');$('#month').value=monthKey(current);current=list.find(m=>monthKey(m)===$('#month').value)||list[0];render()}
function baseEntries(){return current.entries||[]}
function filtered(){const g=$('#group').value,c=$('#category').value,q=$('#search').value.trim().toLocaleLowerCase();return baseEntries().filter(e=>(g==='all'||e.group==g)&&(c==='all'||e.category===c)&&(!q||(`${e.title} ${(e.paragraphs||[]).join(' ')}`).toLocaleLowerCase().includes(q)))}
function updateCategories(){const old=$('#category').value,g=$('#group').value;const available=cats.filter(c=>baseEntries().some(e=>(g==='all'||e.group==g)&&e.category===c));$('#category').innerHTML='<option value="all">全部類別</option>'+available.map(c=>`<option value="${safe(c)}">${safe(c)}</option>`).join('');$('#category').value=available.includes(old)?old:'all'}
function render(){updateCategories();const items=filtered(),reviewStore=reviews(),key=monthKey(current);$('#count').textContent=`${current.label||key} · 顯示 ${items.length}/${baseEntries().length} 篇`;
$('#jumpCount').textContent=items.length;$('#articleCount').textContent=`${items.length} 篇稿件`;
$('#jumps').innerHTML=items.map(e=>`<a href="#${safe(e.id)}">第${e.group}組 · ${safe(e.category)}${e.categoryNo}｜${safe(e.title)}</a>`).join('');
$('#jumpEmpty').hidden=items.length>0;$('#articles').innerHTML=items.length?items.map(e=>{const id=key+'|'+e.id,r=reviewStore[id]||{status:'pending',note:''},rid=safe(id),statusId=`review-status-${rid}`,noteId=`review-note-${rid}`;return `<article class="article" id="${safe(e.id)}"><div class="article-top"><div class="article-review-inline"><div class="review-fields"><div class="review-field"><label for="${statusId}">審查結果</label><select id="${statusId}" data-review-status="${rid}" aria-label="審查結果：${safe(e.title)}"><option value="pending" ${r.status==='pending'?'selected':''}>待審查</option><option value="selected" ${r.status==='selected'?'selected':''}>入選</option><option value="rejected" ${r.status==='rejected'?'selected':''}>不入選</option></select></div><div class="review-field"><label for="${noteId}">審查意見</label><textarea id="${noteId}" data-review-note="${rid}" rows="1" placeholder="可輸入審查意見">${safe(r.note||'')}</textarea></div></div></div><div class="article-heading"><div class="meta">${safe(current.label||key)} · 第${e.group}組 · ${safe(e.category)}${e.categoryNo}</div><h2>第${e.group}組 · ${safe(e.category)}${e.categoryNo}｜${safe(e.title)}</h2></div></div>${(e.paragraphs||[]).map(p=>`<p>${safe(p)}</p>`).join('')}${e.images?.length?`<div class="photos">${e.images.map(i=>`<figure><img loading="lazy" src="${safe(i.src)}" alt="${safe(i.caption||e.title)}"><figcaption>${safe(i.caption||'稿件附圖')}</figcaption></figure>`).join('')}</div>`:''}${e.files?.map(f=>`<p><a href="${safe(f)}" target="_blank" rel="noopener">開啟附件 PDF</a></p>`).join('')}</article>`}).join(''):'<div class="empty">目前條件沒有符合的稿件。調整組別、類別或搜尋關鍵字再試一次。</div>';renderCollection()}
function renderCollection(){const reviewStore=reviews(),entries=[];for(const [k,r] of Object.entries(reviewStore)){if(r?.status!=='selected')continue;const [mk,id]=k.split('|'),m=months.find(x=>monthKey(x)===mk),e=m?.entries?.find(x=>x.id===id);if(e)entries.push({k,m,e,r})}$('#selectedCount').textContent=entries.length;$('#selectedBadge').textContent=entries.length;$('#export').disabled=!entries.length;$('#clear').disabled=!entries.some(x=>monthKey(x.m)===monthKey(current));$('#selectedList').innerHTML=entries.length?'<ol class="review-list">'+entries.map(x=>`<li class="review-item"><div class="review-entry-title">${safe(x.m.label||monthKey(x.m))} · 第${x.e.group}組 ${safe(x.e.category)}${x.e.categoryNo}｜${safe(x.e.title)}</div><p class="review-opinion">${x.r.note?.trim()?`審查意見：${safe(x.r.note)}`:'審查意見：尚未填寫'}</p></li>`).join('')+'</ol>':'<p class="selection-empty">目前尚無標記為入選的作品。請在各篇稿件上方選擇「入選」。</p>'}
async function exportWord(){const reviewStore=reviews(),arr=[];for(const [k,r] of Object.entries(reviewStore)){if(r?.status!=='selected')continue;const [mk,id]=k.split('|'),m=months.find(x=>monthKey(x)===mk),e=m?.entries?.find(x=>x.id===id);if(e)arr.push({m,e,monthLabel:m.label||monthKey(m),reviewStatus:'入選',reviewComment:r.note||''})}if(!arr.length)return;const btn=$('#export'),label=btn.textContent;btn.disabled=true;btn.textContent='正在整理 Word…';try{const bytes=await ReviewDocx.build(arr),blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='入選作品集.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}catch(err){alert('Word 匯出失敗：'+err.message)}finally{btn.disabled=false;btn.textContent=label;renderCollection()}}
function closePanels(){for(const [btn,panel] of [['#filterJumpToggle','#filterJumpPanel'],['#collectionToggle','#collectionPanel']]){$(btn).setAttribute('aria-expanded','false');$(panel).hidden=true}}
function togglePanel(button,panel){const opening=$(button).getAttribute('aria-expanded')!=='true';closePanels();if(opening){$(button).setAttribute('aria-expanded','true');$(panel).hidden=false}}
$('#filterJumpToggle').onclick=()=>togglePanel('#filterJumpToggle','#filterJumpPanel');$('#collectionToggle').onclick=()=>togglePanel('#collectionToggle','#collectionPanel');
$('#group').onchange=render;$('#category').onchange=render;$('#search').oninput=render;
$('#year').onchange=()=>{const list=months.filter(m=>m.year==$('#year').value).sort((a,b)=>a.month-b.month);if(list.length)current=list[0];fillMonths()};$('#month').onchange=()=>{current=months.find(m=>monthKey(m)===$('#month').value)||current;render()};
$('#articles').addEventListener('change',e=>{const t=e.target.closest('[data-review-status]');if(!t)return;const x=reviews(),r=x[t.dataset.reviewStatus]||{status:'pending',note:''};r.status=t.value;x[t.dataset.reviewStatus]=r;saveReviews(x);renderCollection()});$('#articles').addEventListener('input',e=>{const t=e.target.closest('[data-review-note]');if(!t)return;const x=reviews(),r=x[t.dataset.reviewNote]||{status:'pending',note:''};r.note=t.value;x[t.dataset.reviewNote]=r;saveReviews(x);if(r.status==='selected')renderCollection()});$('#export').onclick=exportWord;
$('#clear').onclick=()=>{const x=reviews();for(const [k,r] of Object.entries(x))if(k.startsWith(monthKey(current)+'|')&&r.status==='selected')r.status='pending';saveReviews(x);render()};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const m=JSON.parse(await e.target.files[0].text());if(!m.year||!m.month||!Array.isArray(m.entries))throw Error('資料格式不符');const i=months.findIndex(x=>monthKey(x)===monthKey(m));if(i>=0)months[i]=m;else months.push(m);const extras=months.filter(x=>!initial.some(y=>monthKey(y)===monthKey(x)));localStorage.setItem(DBKEY,JSON.stringify(extras));months.sort((a,b)=>a.year-b.year||a.month-b.month);current=m;fillDates();$('#month').value=monthKey(m);alert('月份資料已加入此瀏覽器。請確認該月份的圖片資產路徑也可讀取。')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};
$('#jumps').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const target=document.getElementById(decodeURIComponent(a.hash.slice(1)));if(!target)return;e.preventDefault();closePanels();history.replaceState(null,'',a.hash);requestAnimationFrame(()=>{const offset=$('#stickyTools').getBoundingClientRect().height+12;const y=target.getBoundingClientRect().top+window.pageYOffset-offset;window.scrollTo({top:Math.max(0,y),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})})});
document.addEventListener('click',e=>{if(!e.target.closest('#stickyTools'))closePanels()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});migrateLegacyPicks();fillDates();
</script>
</body></html>
